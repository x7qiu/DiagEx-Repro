curation: source_transcribed
source_status: informative
explanation: 'A.4 Loop identification number

  A.4.1 A Loop Identification Number is a unique combination of letters and numbers
  that is assigned to

  each monitoring and control loop in a facility to identify the process or machine
  variable that is

  being monitored or controlled and should be assigned to each:

  a) Primary monitoring and control loop.

  b) Self-contained measuring or control device.

  c) Secondary measuring or monitoring device if future primary loops are anticipated
  or if it is

  the standard practice of the User.

  A.4.2 Loop Identification Numbers assigned, as the basis for Instrument Identification/Tag
  Numbers to

  auxiliary or accessory devices, should be the same as the loop for which the devices
  are

  required.

  A.4.3 Loop Identification Numbers are assigned:

  a) First Letters from Table 4.1 to identify loop Measured/Initiating Variables.

  b) Numerals to form a unique loop identity.

  c) Optional loop suffixes to identify identical loops on identical pieces of equipment
  or

  services.'
