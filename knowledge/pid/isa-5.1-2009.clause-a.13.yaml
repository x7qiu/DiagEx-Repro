explanation: 'A.13 Secondary, auxiliary, and accessory instrumentation

  A.13.1 Secondary instrumentation, such as level glasses, pressure gauges, and thermometers,
  may be

  assigned either:

  a) An Instrument Identification/Tag Number which should be either of:

  1) LG-*01, PG-*01, TG-*01, etc.

  2) LI-*01, PI-*01, TI-*01, etc.

  b) A generic identification number that defines the instrument type and range which
  should

  be either of:

  1) LG-24 – 0-24in, PG-200 – 0-200psig, TG-250 – 0-250degF.

  2) LI-24 – 0-24in, PI-200 – 0-200psig, TI-250 – 0-250degF.

  A.13.2 Readout/Passive Function letter for glass, gauge, or viewing device [G] is
  recommended for use

  for flow glasses [FG], level glasses or gauges [LG], pressure gauges [PG], thermometers
  [TG],

  etc., to avoid database management problems with primary flow indicators [FI], level
  indicators

  [LI], pressure indicators [PI], temperature indicators [TI], etc.

  A.13.3 Current common usage is [FG] and [LG] for flow and level and [PI] and [TI]
  for pressure and

  temperature.

  A.13.4 Auxiliary instrumentation, such as signal computing and converting relays,
  solenoid valves, and

  analyzer sample conditioning units, are identified by a loop Measured/Initiating
  Variable and the

  Output/Active Function [Y], as in, [FY], [PY], etc.

  A.13.5 Instrumentation accessories, such as flowmeter runs, purge meters, air sets,
  seal pots, etc., that

  may or may not be explicitly shown on a diagram should be tagged in the Instrument
  index.

  A.13.6 A purge meter for pressure transmitter [PT-*23] may be tagged:

  a) With the Instrument Identification/Tag Number of the instrument they serve followed
  by a

  word or phrase, that describes their function, for example: [PT-*23 PURGE].

  b) With an Instrument Identification/Tag Number as a component of the loop: [PX-*23]
  with

  a note outside the bubble or in the note section of the drawing describing its use.

  c) As a secondary instrument:

  1) [FI-*11] if not controlling purge flow.

  2) [FICV-*11] if controlling purge flow.

  A.13.7 Assignment of a tag number to an accessory;

  a) Means that it must be listed in the instrument index.

  b) Does not mean that it must be shown on a P&ID.

  c) Means that it must be tagged on a P&ID if shown.

  A.13.8 The identification methods chosen for a project should be documented in the
  Owners or Users

  engineering and design standards and guidelines and on a drawing or document legend
  sheet.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
