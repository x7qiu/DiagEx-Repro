id: isa-5.1-2009.t5.7-12
version: 2
concept: Basic memory
aliases: []
reference_type: symbol
kind: definition
curation: source_transcribed
source_status: normative
explanation: • Outputs [C] and [D] are always opposite. • If input [A] equals (1)
  then output [C] equals (1) and output [D] equals (0). • If input [A] changes to
  (0) output [C] remains (1) until input [B] equals (1) then output [C] equals (1)
  and output [D] equals (0). • If input [B] equals (1) then output [D] equals (1)
  and output [C] equals (0). • If input [B] changes to (0) output [D] remains (1)
  until input [A] equals (1), then output [D] equals (1) and output [C] equals (0).
  • If inputs [A] and [B] are simultaneously equal to (1) then outputs [C] and [D]
  change state.
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
