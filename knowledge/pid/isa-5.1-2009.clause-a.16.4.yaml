explanation: 'A.16.4 Table A.4 — Loop and Identification Tag Number suffixes

  (1) Replace asterisk in Loop Numbers with any digit from 0 to 9 or any combination
  of numerals.

  (2) Punctuation shown is recommended.

  (3) Case 1 and Case 2 may be reversed or a single case may be used for all applications.

  Annex B Graphic symbol guidelines (informative annex)'
