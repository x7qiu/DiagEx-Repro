explanation: '3.1.41 manual loading station:

  a device or function that has a manually adjustable output, and may also have indicators,
  lights, and/or

  other functions, that is used to actuate and/or modulate one or more devices, but
  does not provide

  switching between auto-manual modes of a control loop.'
