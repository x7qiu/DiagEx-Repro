concept: 1 — Purpose
aliases: []
reference_type: convention
kind: definition
curation: source_transcribed
source_status: normative
explanation: '1 Purpose

  This standard establishes a uniform means of depicting and identifying instruments
  or devices and their

  inherent functions, instrumentation systems and functions, and application software
  functions used for

  measurement, monitoring, and control, by presenting a designation system that includes
  identification

  schemes and graphic symbols.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
