explanation: '2.4 Application to classes of instrumentation and to instrument functions

  2.4.1 The identification and symbolism methods provided in this standard are applicable
  to all classes

  and types of measurement and control instruments and/or functions.

  2.4.2 The methods can be used for, but are not limited to, describing and identifying:

  a) Discrete instruments and their functions.

  b) Shared display and control functions.

  c) Distributed control functions.

  d) Computer control functions.

  e) Programmable logic controller display and control functions.

  f) Application software display and control functions.'
