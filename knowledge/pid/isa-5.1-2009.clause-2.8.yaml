kind: definition
curation: source_transcribed
source_status: normative
explanation: '2.8 Inclusion and modification of this standard in User engineering
  and design documents

  2.8.1 This standard may be used and, if used, shall be credited by a User/Owner
  in the preparation of

  engineering, design, or project standards, guidelines, and specifications, either
  without exception or with

  exception per the following:

  a) Without exception, in which case this standard in its entirety shall be mandatory
  with

  respect to:

  1) Letters assigned a specific meaning in Table 4.1.

  2) Symbols and their assigned meanings in Tables.5.1 through 5.8.

  3) Symbol dimensions in Tables 6.1 through 6.8.

  b) With exceptions, in which case the parts of this standard for which exception
  is:

  1) Taken shall be fully described and detailed in the User/Owner standards,

  guidelines, or specifications and in drawing cover sheet legends and notes.

  2) Not taken shall be mandatory.

  2.8.2 Symbols different from those given in this standard and User’s choice letters
  when used, shall be

  fully described and detailed in the User/Owner’s standards, guidelines, or specifications
  and in drawing

  cover sheet legends and notes.

  2.8.3 A User must choose a numbering scheme, graphic symbol, and other choices where
  required,

  and document those choices.

  2.8.4 When a previous issue of this standard is included by reference with or without
  exception in

  User/Owner’s engineering and design standards, guidelines or specifications, that
  standard in part or in

  its entirety shall be mandatory until such time as the User/Owner’s guidelines or
  standards are revised.

  2.8.5 Symbols and the meanings of letters and symbols from previous versions of
  this standard that are

  different from those contained in this version may continue to be used provided
  they are clearly

  referenced in the User’s engineering and design standards, practices, and/or guidelines.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
