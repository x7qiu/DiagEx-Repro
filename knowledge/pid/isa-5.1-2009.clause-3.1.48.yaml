explanation: '3.1.48 primary element:

  an external or internal instrument or system element that quantitatively converts
  the measured variable

  into a form suitable for measurement; see also detector and sensor:

  a) an orifice plate is an external primary element

  b) the sensor of a transmitter is an internal primary element.'
