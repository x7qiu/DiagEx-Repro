explanation: '3.1.4 application software:

  software specific to a user application that is configurable and in general contains
  logic sequences,

  permissive and limit expressions, control algorithms, and other code required to
  control the appropriate

  input, output, calculations, and decisions; see also software'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
