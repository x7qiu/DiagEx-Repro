explanation: 'A.16.2 Table A.2 — Allowable letter/number combinations for loop numbering
  schemes.

  (1) First Letters do not include all possibilities.

  (2) Replace asterisk in Loop Number with any digit from 0 to 9 or any combination
  of numerals.

  (3) Variable Modifier safety instrumented system [Z] is technically not a direct-measured
  variable but

  is used to identify loops in a Safety Instrumented System. And because of the critical
  nature of

  such loops, any Measured/Initiating Variable followed by [Z], such as [FZ], [PZ],
  and [TZ], should

  be considered as Measured/ Initiating Variables in all Loop Identification Number
  construction

  schemes

  (a) An alternate method for identifying Safety Instrumented System loops is to append
  [(SIS)]

  outside the bubbles of Safety Instrumented System loops and as a prefix or suffix
  to the Loop

  Number when used in text. For example, Loop Numbers for pressure and temperature
  loops in an

  SIS may be [(SIS)PZ-*01] or [TZ-*09(SIS)].

  (4) Users should assign, as needed, meanings to:

  (a) Users Choice Measured/Initiating Variable letters [C], [D], [G], [M], [N], and
  [O].

  (b) Variable Modifier letter blanks [A], [B], [C], [E], [G], [H], [I], [L], [M],
  [N], [O], [P], [R], [T],

  [U], [V], and [W].

  (5) Variable Modifier safety [S] is technically not a direct-measured variable but
  is used to identify

  self-actuated emergency protective primary and final control elements only when
  used in

  conjunction with Measured/Initiating Variables flow [F], pressure [P] or temperature
  [T]. And

  because of the critical nature of such devices, [FS], [PS], and [TS] should be considered
  as

  Measured/ Initiating Variables in all Loop Identification Number construction schemes:

  (a) Shall not be used to identify Safety Instrumented Systems and components.

  (6) Measured/Initiating Variables [V], [W], or [Z] when used in a Safety Instrumented
  System and:

  (a) Not axially oriented should use [VZ], [WZ], and [ZZ] as Measured/Initiating
  Variables.

  (b) Axially oriented should use [VZX], [VZY], [VZZ], and [WZX], [WZY], [WZZ] and
  [ZZX],

  [ZZY], [ZZZ] as Measured/Initiating Variables.'
