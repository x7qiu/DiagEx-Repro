concept: control valve
aliases: []
reference_type: convention
kind: definition
curation: source_transcribed
source_status: normative
explanation: '3.1.21 control valve:

  a device, other than a common, hand-actuated process block valve or self-actuated
  check valve, that

  directly manipulates the flow of one or more fluid process streams.

  a) the designation "hand control valve" shall be limited to hand-actuated valves
  that when used for

  process throttling require identification as an instrument or control device.'
