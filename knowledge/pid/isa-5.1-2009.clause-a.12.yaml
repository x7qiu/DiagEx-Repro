explanation: 'A.12 Multivariable, multifunction, and multipoint loops

  A.12.1 Loops that have more than one input and/or output are classified as:

  a) Multivariable: when two or more Measured/Initiating Variables of the same or
  different

  kinds generate one Output/Active Function and one or more Readout/Passive Functions.

  b) Multifunction: when one Measured/Initiating Variable generates two or more

  Output/Active or Readout/Passive Functions.

  c) Multivariable/multifunction: when two or more Measured/Initiating Variables of
  the same

  or different kinds generates two or more Output/Active or Readout/Passive Functions..

  d) Multipoint: when two or more Measured/Initiating Variables of the same or different
  kinds

  generate two or more Readout/Passive Functions.

  A.12.2 Multivariable Loop Number assignments using pressure [P-*07], temperature
  [T-*03], and speed

  [S-*02] loops, for example, should be either:

  a) Alphabetically ordered Measured/Initiating Variables with Loop Number numerals
  the

  same as or different from the leading Measured/Initiating Variable: [PTS-*07] or
  [PTS-*10].

  b) Multivariable Measured/Initiating Variable [U]: [U-*01]

  A.12.3 Multivariable Loop components should be assigned Instrument/Tag Numbers as
  an example for:

  a) Inputs: [PT-*07], [TT-*03], and [ST-*02].

  b) Output: either [PTSV*07], [PTSV-*10], or [UV-*01].

  A.12.4 Multifunction Instrument/Tag Number assignments using a flow [F] loop with
  indicating [I],

  controlling [C], and switching [S] functions, for example, should be either [FICS-*05].or
  [FU-*05].

  A.12.5 Multivariable/multifunction Loop Number assignments using flow [F-*05], pressure
  [P-*07],

  temperature [T-*03], and speed [S-*02] loops, for example, should be either:

  a) Alphabetically ordered Measured/Initiating Variables with Loop Number numerals
  the

  same as or different from the leading Measured/Initiating Variable: [FPTS-*05] or
  [FPTS-*10].

  b) Multivariable Measured/Initiating Variable [U]: [U-*01]

  A.12.6 Multivariable/Multifunction Loop components should be assigned Instrument/Tag
  Numbers as an

  example for:

  a) Inputs: [FT-*05], [PT-*07], [TT-*03], and [ST-*02].

  b) Output: either [PTSV*07] or [PTSV-*10], and [FV-*05], or [UV-*01A] and [UV-*01B].

  A.12.7 Multipoint Loop and Instrument/Tag Number identification letter assignments
  for :

  a) Single Measured/Initiating Variable, using temperature [T] as an example, should
  be:

  1) Loop Number: [T-*11].

  2) Input: [TE-*11-01], [TE-*11-02], etc. or [TJE]-*11-01, [TJE-*11-02], etc.

  3) Readout: [TI-*11] or [TJI-*11]

  4) Readout point; [TI-*11-01], [TI-*11-02], etc. [TJI-*11-01], [TJI-*11-02], etc.

  b) Multiple Measured/Initiating Variables, using pressure [P] and temperature [T]
  as an

  example, should be:

  1) Loop Number: [PT-*11] or [U-*01].

  2) Input: [PT-*11-01], [TE-*11-02], etc. or [PJT-*11-01], [TJE-*11-02], etc.

  3) Readout: [PTI-*11] or [PTJI-01] or [UI-*01] or [UJI-*01].

  4) Readout point: [PI-11-01], [TI-11-02], etc. or [PJI-11-01], [TJI-11-02], etc.'
