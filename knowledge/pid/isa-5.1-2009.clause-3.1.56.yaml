source_status: normative
explanation: '3.1.56 sensor:

  a separate or integral part or function of a loop or an instrument that first senses
  the value of a process

  variable, that assumes a corresponding predetermined and intelligible state, and/or
  generates an output

  signal indicative of or proportional to the process variable; see also detector
  and primary element.'
