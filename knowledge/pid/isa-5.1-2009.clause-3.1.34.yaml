source_status: normative
explanation: '3.1.34 high level control system (HLCS):

  A system that provides sophistication above that of the BPCS; with functions typically
  based in process

  computer or higher level hardware that interacts with the process by manipulating
  setpoints in the BPCS.

  (a) Control functions in the HLCS include, but are not limited to, statistical process
  control and model

  predictive control.

  (b) An HLCS is not necessary to operate a plant or process.'
