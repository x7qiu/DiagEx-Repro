explanation: '3.1.23 datalink:

  a wire, cable, or electromagnetic network or bus system that connects field-located
  devices with

  dedicated microprocessors so that they share a common database and communicate according
  to a rigid

  protocol in a hierarchical and/or peer-to-peer relationship to other such devices
  and/or compatible

  microprocessor-based systems; see also communication link.

  a) wire or cable networks may be twisted pair, coaxial, telephone, or fiber optic.

  b) electromagnetic networks may be radio or microwave.'
