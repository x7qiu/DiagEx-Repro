explanation: '3.1.2 alarm:

  an indicating device or function that provides a visible and/or audible indication
  if and when the value of a

  measured or initiating variable is outside of set limits, has changed from a safe
  to an unsafe condition, or

  has changed from a normal to an abnormal operating state or condition.

  a) actuation may be by a binary or analog device or function.

  b) indication may be by any or all of the following: annunciator panels, flashing
  lights, printers,

  buzzers, bells, horns, sirens, or shared graphic display systems.'
