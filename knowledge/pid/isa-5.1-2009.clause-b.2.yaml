id: isa-5.1-2009.clause-b.2
version: 2
concept: B.2 — Instrument identification applied to graphic symbols
aliases: []
reference_type: convention
kind: common_practice
curation: source_transcribed
source_status: informative
explanation: 'B.2 Instrument identification applied to graphic symbols

  B.2.1 Instrument identification applied to graphic symbols should include, as a
  minimum, an alphabetic

  functional identification to identify the functionality of devices and functions
  shown in the diagrams

  as described in Annex A.

  B.2.2 Tables A.3.1.1 through A.3.6.2 provide examples of allowable functional identifications.

  B.2.3 Brief explanatory notes or other text may be added adjacent to a symbol or
  in the note section of

  a drawing or sketch to clarify the meaning or purpose of a device or function.

  B.2.4 Loop Identification Number numerals, when assigned in accordance with A.6,
  complete the

  identity of the loop being shown.

  B.2.5 Lettering fonts should be similar to Arial Narrow and be a minimum of 3/32in(1.125mm)
  high and

  a maximum of 13 characters per inch wide.

  B.2.6 A Loop Number prefix should:

  a) Not be used with bubbles on drawings but indicated in the note section.

  b) Be used with bubbles if more than one prefix is being used.

  c) Be used in text.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
