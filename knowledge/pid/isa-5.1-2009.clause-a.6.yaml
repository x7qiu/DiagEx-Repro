concept: A.6 — Loop identification number numerals
aliases: []
reference_type: convention
kind: common_practice
curation: source_transcribed
source_status: informative
explanation: 'A.6 Loop identification number numerals

  A.6.1 Loop Identification Number numerals should be assigned to loop measured variable
  letters

  according to one of the following methods selected by the end user:

  a) Parallel: duplicated numerical sequences for each loop variable letter or first
  letter

  combination.

  b) Serial: single numerical sequence regardless of loop variable letter or first
  letter

  combination.

  c) Parallel/Serial: parallel sequences for selected loop variable letters or first
  letter

  combinations and a serial sequence for the remainder.

  A.6.2 Loop Number numerical sequences are normally three or more digits, -*01, -*001,
  -*0001, etc.

  where the asterisk * can be :

  a) Any digit from zero to 9.

  b) Coded digits related to drawing numbers, unit numbers, equipment numbers, etc.

  A.6.3 *00, *000, *0000, etc. should be used only for special, significant, or critical
  loops as defined by

  the User.

  A.6.4 000, 0000, 00000, etc. should not be used

  A.6.5 Loop Identification letters and numbers should be assigned in accordance with
  one of the

  following Loop Numbering Schemes:

  a) No. 1 Parallel – Measured/Initiating Variable.

  b) No. 2 Parallel – Measured/Initiating Variable with Variable Modifier.

  c) No. 3 Parallel – First Letter(s).

  d) No. 4 Series – Measured/Initiating Variable.

  e) No. 5 Series – Measured/Initiating Variable with Variable Modifier.

  f) No. 6 Series – First Letter(s).

  g) No. 7 Parallel/Series – Measured/Initiating Variable.

  h) No. 8 Parallel/Series – Measured/Initiating Variable with Variable Modifier.

  i) No. 9 Parallel/Series – First Letter(s).

  A.6.6 Gaps should be left in any sequence to allow for the addition of future loops.

  A.6.7 See Table A.2 — Allowable letter/number combinations for, loop numbering schemes
  for

  examples of typical Loop Number assignments.'
