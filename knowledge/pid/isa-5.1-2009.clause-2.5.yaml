explanation: '2.5 Classification of instrumentation

  2.5.1 Instrumentation may be classified as primary, secondary, auxiliary, or accessory
  for assigning

  Loop and Functional Identities and symbols as defined in Clause 4 and shown in Annex
  A.

  2.5.2 Primary instrumentation consists of measuring, monitoring, controlling, or
  calculating devices and

  hardware and their inherent functions and software functions that include, but are
  not limited to,

  transmitters, recorders, controllers, control valves, self-actuated safety and control
  devices, and

  application software functions that require or allow user-assigned identifications.

  2.5.3 Secondary instrumentation consists of measuring, monitoring, or controlling
  devices and

  hardware that include, but are not limited to, level glasses, pressure gauges, thermometers,
  and pressure

  regulators.

  2.5.4 Auxiliary instrumentation consists of devices and hardware that measure, control,
  or calculate

  and that are needed for effective operation of primary or secondary instrumentation;
  they include, but are

  not limited to, calculating devices, purge meters, sample handling systems, and
  instrument air sets.

  2.5.5 Accessory instrumentation consists of devices and hardware that do not measure
  or control but

  are needed for effective operation of the measuring, monitoring, or control system;
  they include, but are

  not limited to, flowmeter tube run, straightening vanes, and seal pots.'
