id: isa-5.1-2009.clause-a.7
version: 2
concept: A.7 — Optional loop number prefixes
aliases: []
reference_type: convention
kind: common_practice
curation: source_transcribed
source_status: informative
explanation: 'A.7 Optional loop number prefixes

  A.7.1 Loop Number Prefixes consisting of any combination of alpha/numeric characters
  that may be

  added to Loop Numbers to identify loop location, such as a complex, plant, or unit
  should be

  located before the Measured/Initiating Variable, for example, a flow loop in processing
  plant #1

  might be [PP1-F*01].

  A.7.2 Loop Number Prefixes should:

  a) Not necessarily be shown on drawings or indexes but covered by a general note
  on a

  legend sheet or a note on each drawing or index sheet.

  b) Be shown for all uses on drawings when more than one prefix is required by loops
  shown

  on the drawing.

  c) Be shown when used in text.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
