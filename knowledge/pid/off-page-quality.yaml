concept: Connector drafting quality is separate from connector identity
kind: drawing_quality_recommendation
explanation: The supplied illustration discourages middle and vertical placement while
  explicitly allowing exceptions in some companies. Record unconventional placement
  for review; do not remove a physically supported connector because its layout is
  discouraged.
