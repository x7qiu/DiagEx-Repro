concept: 5.1 — Graphic symbol tables
aliases: []
reference_type: convention
kind: definition
curation: source_transcribed
source_status: normative
explanation: '5.1 Graphic symbol tables

  5.1.1 This clause provides in tabular form the graphic building blocks that are
  used to construct

  diagrams for measurement and control loops, instruments, and functions in a concise,
  easily referenced

  manner.

  5.1.2 The graphic symbol sets included in this clause are intended to be used to
  prepare:

  a) Instrumentation diagrams.

  b) Functional diagrams.

  c) Binary logic diagrams.

  d) Electrical schematics.

  5.1.3 The graphic symbols shown in the tables are drawn full size for use in full
  size sketches or

  drawings.

  5.1.4 The device and function symbols shown in Table 5.1.1 are based on the traditional
  7/16-inch or

  11mm circle format but may be changed to the often-used 1/2-inch or 12mm circle
  format.

  5.1.5 Consideration shall be given to the size of reduced P&IDs when selecting symbol
  sizing.

  5.1.6 All symbols shall maintain the size ratios shown in the tables when reduced
  or increased in size.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
