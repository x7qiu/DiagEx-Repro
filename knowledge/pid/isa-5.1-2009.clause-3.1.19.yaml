id: isa-5.1-2009.clause-3.1.19
version: 2
concept: controller
aliases: []
reference_type: convention
kind: definition
curation: source_transcribed
source_status: normative
explanation: '3.1.19 controller:

  a device having an output that varies to regulate a controlled variable in a specified
  manner that may be a

  self-contained analog or digital instrument, or may be the equivalent of such an
  instrument in a shared-

  control system.

  a) an automatic controller varies its output automatically in response to a direct
  or indirect input of a

  measured process variable.

  b) a manual controller, or manual loading station, varies its output in response
  to a manual

  adjustment; it is not dependent on a measured process variable.

  c) a controller may be an integral element of other functional elements of a control
  loop.'
