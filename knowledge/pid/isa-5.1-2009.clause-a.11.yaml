kind: common_practice
curation: source_transcribed
source_status: informative
explanation: 'A.11 Optional punctuation marks in identification numbers

  A.11.1 Punctuation marks, hyphens, slashes, etc., may be used to separate sections
  of identification

  numbers as required by:

  a) User/Owner.

  b) Database management system.

  c) Control system application software.

  A.11.2 Punctuation is recommended for use between:

  An alphabetic Loop Number prefix and Measured/Initiating Variable letters: [AB-P*05].

  a)

  Loop Number numerals and a numeric Loop Number suffix: [AB-P*05-1, AB-P*05-2],

  b)

  Loop Number numerals and Tag Number suffix: [10-P*05-A1A or 10-P*05-1A1]

  c)

  A Loop Number suffix and Tag Number suffix: [10PT*05A-A or 10PT*05-1-A].

  d)

  A.11.3 Punctuation is optional for use between:

  A Numeric Loop Number prefix and Measured/Initiating Variable letter: [10-P*05].

  a)

  b) A Measured /Initiating Variable letter and Loop Number numerals: [10P*-05].

  A.11.4 Punctuation should not be used between:

  a) Loop Number numerals and an alphabetic Loop Number suffix: [10P*05A].

  Additional Tag Number suffixes: [10PV*05A-A1A].

  b)

  A.11.5 Backslashes are normally used between Functional Identification letters for
  multifunction devices

  when used in text, [TR⁄TSH-*108].'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
