  explanation: '5.3.8 Table 5 8 — Electrical schematic symbols

    (1) All devices are shown in the unactuated or de-energized condition.

    (2) Switch contacts 2, 3, and 4 shall be actuated by:

    (a) Hand.

    (b) Actuator symbols 5 and 6.

    (3) Actuator symbols 5 and 6 shall actuate switch symbols 2, 3, and 4.

    (4) Switch symbols 7, 8, and 9.shall be actuated by:

    (a) Hand.

    (b) Actuator symbols 11 through 16.

    (c) Bubble symbol for device or function assigned to actuate the switch symbol.

    (5) Actuator symbols 11 through 16 shall actuate switch symbols 7, 8, and 9.

    (6) Users engineering and design standards, practices and/or guidelines shall
    document which

    symbol has been selected.'
  asset_id: clause-5.3.8-p35
text_slots: []
interpretation:
- The panels retain all source alternatives and annotations; they are not tight drawing-object
  bounding boxes.
- Item numbers, method labels, note markers, equations, and illustrative tags are
  not automatically symbol geometry or actual drawing tags.
- Apply each placeholder according to its own row and linked notes. Asterisks, question
  marks, letters, and numbers do not have one universal meaning.
- Assign text, ports, coordinates, and connections only from the drawing occurrence;
  preserve uncertainty.
