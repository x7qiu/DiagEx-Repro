concept: analog
aliases: []
reference_type: convention
kind: definition
curation: source_transcribed
source_status: normative
explanation: '3.1.3 analog:

  a signal or device that has no discrete positions or states and changes value as
  its input changes value

  and when used in its simplest form, as in "analog signal" as opposed to "binary
  signal”; the term denotes

  a continuously varying quantity.'
