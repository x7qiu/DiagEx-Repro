id: isa-5.1-2009.clause-a.2
version: 2
concept: A.2 — Instrument index
aliases: []
reference_type: convention
kind: common_practice
curation: source_transcribed
source_status: informative
explanation: 'A.2 Instrument index

  A.2.1 Loop Identification Numbers and Instrument Identification/Tag Numbers are
  recorded in an

  Instrument Index that should be maintained for the life of the facility for the
  recording and control

  of all documents and records pertaining to the loops and their instrumentation and
  functions.

  A.2.2 An Instrument Index should contain references to all instrumentation data
  required by owner

  and/or government regulatory agency management of change requirements and contain,
  as a

  minimum for each loop:

  a) Loop Identification Number.

  b) Service Description.

  c) Instrument Identification/Tag Numbers.

  d) Piping and Instrumentation Diagram drawing numbers.

  e) Instrument Data Sheet numbers.

  f) Location Plan drawing numbers.

  g) Installation Detail drawing numbers.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
