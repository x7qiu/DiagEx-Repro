explanation: '2.2 Application to industries

  2.2.1 This standard is suitable for use in the chemical, petroleum, power generation,
  metal refining,

  pulp and paper, and numerous other continuous, batch, discrete-part processing,
  and material-handling

  industries. These industries and others require the use of control system schematics,
  functional

  diagrams, and electrical schematics to describe the relationship to processing equipment
  and the

  functionality of measurement and control equipment.'
