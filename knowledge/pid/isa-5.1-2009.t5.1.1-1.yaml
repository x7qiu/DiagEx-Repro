    passage: Clause 5.3.1
    image: illustrations/isa-5.1-2009/complete/clause-5.3.1-p32.png
  explanation: '5.3.1 Tables 5.1.1 and 5.1.2 — Instrumentation device and function
    symbols:

    (1) Devices and functions that are represented by these bubble symbols are:

    (a) Used in shared display, shared control, configurable, microprocessor-based,
    and data-

    linked instrumentation where the functions are accessible by the operator via
    a shared display or

    monitor.

    (b) Configured in control systems that include, but are not limited to, distributed
    control

    systems (DCS), programmable logic controllers (PLC), personal computers (PC),
    and intelligent

    transmitters and valve positioners.

    (2) The user shall select and document one of the following for use of these symbols
    in a:

    (a) Primary shared-display, shared-control system.

    (b) Basic Process Control System (BPCS).

    (3) The user shall select and document one of the following for use of these symbols
    in an:

    (a) Alternate shared-display, shared-control system.

    (b) Safety Instrumented System (SIS).

    (4) Devices and functions represented by these bubble symbols are configured in
    computer systems

    that include, but are not limited to:

    (a) Process controllers, process optimizers, statistical process control, model-predictive

    process control, analyzer controllers, business computers, manufacturing execution
    systems, and

    other systems that interact with the process by manipulating setpoints in the
    BPCS.

    (b) High Level Control System (HLCS)

    (5) Discrete devices or functions that are hardware-based and are either stand-alone
    or are

    connected to other instruments, devices, or systems that include, but are not
    limited to, transmitters,

    switches, relays, controllers, and control valves.

    (6) Accessibility includes viewing, setpoint adjustment, operating mode changing,
    and any other

    operator actions required to operate the instrumentation.

    (7) Functions represented by these symbols are used for simple interlock logic:

    (a) A description of the logic should be shown nearby or in the notes section
    of the drawing

    or sketch if the intended logic is not clearly understandable.

    (b) These symbols are not recommended for depicting complex DCS, PLC, or SIS

    applications that require other than ‘AND’ and ‘OR’ signal gates.

    (8) A logic number, letter, or number/letter combination identification shall
    be used if more than one

    logic scheme is used on the project by:

    (a) Replacing [I], [A], and [O] with the logic identification.

    (b) Appending the logic identification outside the symbol.'
  asset_id: clause-5.3.1-p32
