source_status: normative
explanation: '• Output signal type different from that of input signal. • Input signal
  is on the left and output signal is on the right. • Substitute any of the following
  signal types for ‘P’ or ‘I’: • A = Analog H = Hydraulic • B = Binary I = Current
  • D = Digital O = Electromagnetic • E = Voltage P = Pneumatic • F = Frequency R
  = Resistance'
