  short_name: 断线
  interpretation: 断线 / Line gap. Defined by SH/T 3101:2017, Table 4.1, item 17. Paired curved break marks
    indicate a large omitted line span, such as a pipe passing through equipment. Paired endpoint numbers
    may alternatively identify the gap. These break marks are not letter S tags or equipment symbols;
    continuity still needs drawing evidence.
