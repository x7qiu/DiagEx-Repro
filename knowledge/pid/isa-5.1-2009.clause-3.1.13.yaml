explanation: '3.1.13 communication link:

  a wire, cable, or electromagnetic network or bus system that connects dedicated
  microprocessor-based

  and computer-based systems so that they share a common database, and communicates
  according to a

  rigid protocol in a hierarchical and/or peer-to-peer relationship; see datalink.

  a) wire or cable networks may be twisted pair, coaxial, telephone, or fiber optic.

  b) electromagnetic networks may be radio or microwave.'
