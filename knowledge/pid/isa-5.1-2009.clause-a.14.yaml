source_status: informative
explanation: 'A.14 System identification

  A.14.1 Instrumentation is often assembled into systems for various reasons, such
  as ease of purchase,

  ease of application, and compatibility, and these systems may need to be identified
  on drawings

  and in text.

  A.14.2 Some of the more common instrumentation systems and the system codes often
  used to identify

  them are:

  a) ACS = Analyzer Control System

  b) BMS = Burner Management System

  c) CCS = Computer Control System

  d) CEMS = Continuous Emissions Monitoring System

  e) DCS = Distributed Control System

  f) MMS = Machine Monitoring System

  g) PCCS = Personal Computer Control System

  h) PLC = Programmable Logic Controller

  i) SIS = Safety Instrumented System

  j) VMS = Vibration Monitoring System

  A.14.3 Suffixes may be added to the instrumentation system codes [SC]:

  a) [SC 1, SC 2], etc., when more than one system is used in a complex.

  b) [SC-M, SC-L], when main and local systems are used in a unit.

  c) [SC-‘unit identifier’], when system is dedicated to a single unit in a multi-unit
  facility.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
