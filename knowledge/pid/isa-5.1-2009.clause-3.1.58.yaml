id: isa-5.1-2009.clause-3.1.58
version: 2
concept: shared control
aliases: []
reference_type: convention
kind: definition
curation: source_transcribed
source_status: normative
explanation: '3.1.58 shared control:

  a feature of a control device or function that contains a number of pre-programmed
  algorithms, which are

  user retrievable, configurable, and connectable, and allows user-defined control
  strategies or functions to

  be implemented,

  a) often used to describe the control features of a distributed control system,
  programmable logic

  controller, or other microprocessor or mainframe computer based system.

  b) control of multiple process variables can be implemented by sharing the capabilities
  of a single

  device of this kind.'
