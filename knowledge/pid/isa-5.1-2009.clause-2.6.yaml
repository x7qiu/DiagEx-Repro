explanation: '2.6 Extent of loop and functional identification

  2.6.1 This standard provides identification codes and methods for the alphanumeric
  identification of

  monitoring and controlling loops, instruments and functions.

  2.6.2 These identification methods depend on tagging according to function and not
  according to

  construction or form. For example, a differential pressure transmitter is not identified
  as a differential

  pressure transmitter but as a:

  a) Flow transmitter when connected to an orifice plate when measuring flow.

  b) Level transmitter when connected to the side of a vessel when measuring liquid
  level.

  2.6.3 The user is free to apply added identification by serial, equipment, unit,
  area, or plant number, or

  any other additional means required for the unique identification of a loop, instrument
  or function.

  2.6.4 A unique function identification number shall be assigned to identify each:

  a) Loop instrument or device and its integral and/or inherent functions.

  b) Loop-configurable function, which requires or allows a unique user-assigned

  microprocessor or computer address.'
