  explanation: '5.3.6 Table 5.6 — Signal processing function block symbols:

    (1) Symbols in small squares and rectangles are as used with symbol #1 from Table
    5.1.2.

    (2) Symbols in large rectangles are as used with symbol #5 from Table 5.5.

    (3) Users engineering and design standards, practices and/or guidelines shall
    document which

    symbol has been selected.'
