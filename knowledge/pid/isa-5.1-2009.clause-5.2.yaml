explanation: '5.2 Tables to be used for common applications

  5.2.1 Instrumentation diagrams that represent instrumentation devices and functions
  shall be

  constructed from the symbols shown in:

  a) Tables 5.1.1 and 5.1.2 — Measurement and control devices or functions.

  b) Tables 5.2.1, 5.2.2, 5.2.3, and 5.2.4 — Measurement elements and transmitters.

  c) Tables 5.3.1 and 5.3.2 — Lines, instrument to process or instrument to instrument.

  d) Tables 5.4.1, 5.4.2, 5.4.3, and 5.4.4 — Final control elements.

  e) Table 5.6 — Signal processing function blocks.

  5.2.2 Functional diagrams that represent monitoring and control loops shall be constructed
  from the

  symbols shown in:

  a) Table 5.5 — Functional diagramming symbols.

  b) Table 5.6 — Signal processing function block symbols.

  c) Table 5.7 — Binary logic symbols.

  5.2.3 Binary logic diagrams that represent logic processes shall be constructed
  from the symbols

  shown in:

  a) Table 5.1.1 — Measurement and control devices or functions.

  b) Table 5.7 — Binary logic symbols.

  5.2.4 Electrical schematics that represent electrical circuits shall be constructed
  from the symbols

  shown in:

  a) Table 5.1.1 — Measurement and control devices or functions.

  b) Table 5.8 — Electrical schematic symbols.

  5.2.5 Symbols may be developed to show devices and functions not covered by this
  standard or to

  simplify the depiction of frequently used instrumentation. Such uses shall be fully
  detailed by sketches or

  notes on the drawing legend and detail sheets.

  5.2.6 If new or revised symbols are developed they should be submitted to the ISA-5.1
  committee for

  inclusion in the next revision of this standard.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
