explanation: 'A.3 Loop identification and instrument identification/tag numbers

  A.3.1 Loop Identification Numbers are unique combinations of letters and numbers
  that are assigned to

  each monitoring and control loop in a facility to identify the process or machine
  variable that is

  being monitored or controlled.

  A.3.2 Instrument Identification/Tag Numbers are unique combinations of letters and
  numbers that are

  formed by adding letters to the Loop Identification Number to define the purpose
  of each loop

  device and/or function that comprises a monitoring or control loop.

  A.3.3 Instrument Identification/Tag Numbers are also called Instrument Identification
  Number,

  Instrument Tag Number, Instrument Number, or Tag Number.

  A.3.4 Examples of Loop Identification and Instrument Identification/Tag Numbers
  for a typical loop with

  references to sub-clauses relevant to the components of the Loop and Instrument
  Identification

  /Tag Numbers are given in Table A.1 — Typical Loop and Instrument Identification/Tag
  Numbers.'
