explanation: 'A.5 Loop identification number letters

  A.5.1 Loop Identification Number letters should be selected from Table 4.1 to identify
  the loop

  Measured/Initiating Variable according to one of the following methods selected
  by the end user:

  a) Measured/Initiating Variable: only a Measured/Initiating Variable is selected,
  such as

  analysis [A], flow [F], level [L], pressure [P], temperature [T], etc.

  b) Measured/Initiating Variable with Variable Modifier: a Measured/Initiating Variable
  and,

  when applicable, a Variable Modifier is selected, such as analysis [A], flow [F],
  flow quantity

  [FQ], level [L], pressure [P], differential pressure [PD], temperature [T], differential
  temperature

  [TD], etc.

  c) First-Letters: a Measured/Initiating Variable and, when applicable, a Variable
  Modifier,

  only if the resulting First-Letter combination defines a loop variable that can
  be measured

  directly, such as pressure differential [PD] as opposed to one that is mathematically
  derived,

  such as flow ratio [FF].

  A.5.2 A Measured/Initiating Variable in combination with the safety Variable Modifier
  [S] is always

  treated as a loop variable in each of the preceding selection methods to identify
  self-acting

  devices intended to protect against emergency conditions that may be hazardous to
  plant

  personnel, plant equipment, or the environment.

  A.5.3 A Measured/Initiating Variable is selected according to the physical or mechanical
  property that is

  being measured, derived or initiates an action and not according to the construction
  or mode of

  actuation of the measuring device or the property or the action it initiates:

  a) A loop that controls pressure in a vessel by manipulating gas or vapor flow to
  or from the

  vessel is a pressure [P] loop and not a flow [F] loop.

  b) A loop that measures pressure differential across:

  1) An orifice plate from which flow rate is calculated is a flow [F] loop and not
  a

  pressure [P] or pressure differential [PD] loop.

  2) A fluid interface in a vessel is a level [L] loop and not a pressure [P] or pressure

  differential [PD] loop.

  3) A filter bed or element is a pressure [P] or pressure differential [PD]-loop.'
