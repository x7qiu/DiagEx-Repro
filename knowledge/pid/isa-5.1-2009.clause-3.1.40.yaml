explanation: '3.1.40 loop:

  instrumentation arranged as a combination of two or more instruments or functions
  arranged so that

  signals pass from one to another for the purpose of measurement and indication or
  control of a process

  variable.

  a) a self-contained device that measures and controls a process variable.'
