explanation: '6.3.2 Table 6.2 — Dimensions for measurement symbols: primary elements
  and transmitters, Tables

  5.2.1, 5.2.2, 5.2.3, 5.2.4, and 5.2.5

  (1) Dimension in parentheses is for 1/2-inch (12-millimeter) option for generic
  circle symbol.

  (2) Size as required by size of vessel as drawn or depth of application.

  (3) Dip tube shown, show as required for other devices.'
