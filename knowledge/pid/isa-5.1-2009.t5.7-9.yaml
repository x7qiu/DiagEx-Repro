  explanation: '5.3.7 Table 5.7 — Binary logic symbols:

    (1) True signals are equal to binary one, and false signals are equal to binary
    zero.

    (2) Alternate symbols shall be used only for “AND’ and “OR” gates.

    (3) Users engineering and design standards, practices and/or guidelines shall
    document which

    symbol has been selected.'
  asset_id: clause-5.3.7-p35
