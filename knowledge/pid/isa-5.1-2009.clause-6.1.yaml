explanation: '6.1 Graphic symbols dimension tables

  6.1.1 The following tables provide measurement units for dimensioning the geometric
  shapes that are

  required to construct the graphic symbols.

  6.1.2 The shapes in the tables are drawn twice their normal minimum size for clarity.

  6.1.3 Symbols shall be drawn to a:

  a) Larger size, by increasing the dimensional unit, when required reduction of an
  original

  drawing or document results in an illegible diagram.

  b) Smaller size, by decreasing the dimensional unit, when required by space limitations
  of

  an original drawing or document.

  6.1.4 All the symbols shown in Clause 5 are not individually dimensioned, but the
  geometric shapes

  required to construct all the symbols from the graphic symbol tables are included.

  6.1.5 The traditional minimum size for device and function symbols from Table 6.1,
  a 7/16-inch (10.5-

  millimeter) circle, may be increased to a less commonly used 1/2-inch (12-millimeter)
  circle.'
