kind: common_practice
curation: source_transcribed
source_status: informative
explanation: 'A.15 Identification system guideline tables

  A.15.1 Identification System guideline tables are based on the most common usages
  to be found in the

  chemical and refining process industries.

  A.15.2 The tables are intended to be a guide to constructing such tables based on
  a User’s actual

  requirements.

  A.15.3 Loops are based on the variable being measured and not on the variable being
  manipulated.

  A.15.4 Instrument tag numbers are based on the loop number and the functionality
  required of the loop

  components.'
