explanation: 'A.9 Function identification letters

  A.9.1 Instrument Function Identification letters should be selected from Table 4.1,
  Identification Letters,

  and added to the Loop Identification Number letters to form an Instrument Functional
  Identity.

  A.9.2 The sequence of letters in a Functional Identification should be in the same
  left-to-right order as

  the columns in Table 4.1:

  a) Measured or Initiating Variable, from Column 1.

  b) Modifier, if required, from Column 2.

  c) Passive Readout Function, from Column 3.

  d) Active Output Function, from Column 4.

  e) Modifier(s), if required, from Column 5.

  A.9.3 Functional Identifications should use one Readout/Passive Function or one
  Output/Active

  Function to identify each device or function except, as is common for:

  a) Indicating /recording controller/switch instruments or functions in which one
  Passive

  Function, indicate [I] or record [R] and one Active Function, control [C] or switch
  [S], is

  combined to form, for example, pressure recording controller [PRC], or low-pressure
  indicating

  switch [PISL].

  b) Self-actuated control valves, in which two Active Functions control [C] and valve
  [V] are

  combined to form, for example, pressure control valve [PCV].

  A.9.4 The number of letters in a Functional Identification should be sufficient
  to fully describe the

  functionality of the device or function being identified, but generally should not
  exceed eight.

  A.9.5 Function Modifiers designate the relative value of the measured or initiating
  variable that actuates

  the instrument or function, for example for Function Modifier low [L]:

  a) [PSL-*01] indicates actuation by a pressure below a setpoint, normally used to
  indicate a

  process level that requires operator intervention to prevent a process trip or other
  unwanted

  result.

  b) [PSLL-*01] indicates actuation below a setpoint lower than the previous example,

  normally used to indicate a process level that resulted in a process trip.

  A.9.6 A device or function common to two or more loops should be assigned a Loop
  Identification Letter

  for the loop which actuates the instrument:

  a) A solenoid valve that is actuated by a high level switch [LSH] to trip a flow
  control valve

  [FV] is assigned to the level [L] loop as an [LY] and not to the flow [F] loop as
  an [FY].

  b) A high signal select device or function that selects the higher signal from a
  flow [F] loop

  and a high level [L] override loop is assigned to the flow [F]-loop as an [FY] and
  not to the

  level [L] loop as an [LY].

  A.9.7 For allowable function letter combinations see tables:

  a) A.3.1 — Allowable succeeding letter combinations for readout/passive function
  letters.

  b) A.3.2 — Allowable succeeding letter combinations for output/active function letters.'
