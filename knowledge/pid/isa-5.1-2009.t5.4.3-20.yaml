    passage: Clause 5.3.4
    image: illustrations/isa-5.1-2009/complete/clause-5.3.4-p34.png
  explanation: '5.3.4 Tables 5.4.1, 5.4.2, 5.4.3 and 5.4.4 — Final control element
    symbols:

    (1) Users engineering and design standards, practices, and/or guidelines shall
    document which

    symbols have been selected.

    (2) Element symbols 1 through 14, when combined with actuator symbols 1 through
    16, represent

    process control valves.

    (3) Element symbol 2, when combined with actuator symbols 20 and 21, represent
    pressure safety

    valves.

    (4) Element symbols 15 through 19, when combined with actuator symbols 13, 14,
    and 15, represent

    on-off solenoid valves.

    (5) Element symbol 21, when combined with actuator symbols 1 through 16, represents
    a variable

    speed control unit.

    (6) Element symbol 21 represents a motor that manipulates or controls a process
    variable.

    (7) Actuator symbols 1 through 16, when combined with element symbols 1 through
    14, represent

    process control valves and with element symbol 21 represents a variable speed
    control unit.

    (8) Actuator symbols 17, 18, and 19, when combined with element symbols 15 through
    19, represent

    on-off solenoid valves.

    (9) Actuator symbols 20 and 21, when combined with element symbol 2, represent
    pressure safety

    valves.

    (10) The symbols are applicable to all types of control valves and actuators.'
  asset_id: clause-5.3.4-p34
