explanation: '2.3 Application to work activities

  2.3.1 This standard is suitable for use whenever reference to measurement and control

  instrumentation, control devices and functions, and software applications and functions
  is required for

  identification and symbolization, such as:

  a) Design sketches.

  b) Teaching examples.

  c) Technical papers, literature, and discussions.

  d) Instrumentation, loop, logic, and functional diagrams.

  e) Function descriptions.

  f) Conceptual drawings including but not limited to:

  1) Process Flow Diagrams (PFD)

  2) Utility Flow Diagrams (UFD).

  g) Construction drawings including but not limited to:

  1) Engineering Flow Diagrams (EFD).

  2) Mechanical Flow Diagrams (MFD).

  3) Piping and Instrumentation Diagrams (P&ID).

  4) System Flow Diagrams (SFD).

  h) Specifications, purchase orders, manifests, and other lists.

  i) Identification and tag numbering of instruments and control functions.

  j) Installation, operating and maintenance instructions, drawings, and records.

  2.3.2 This standard provides sufficient information to enable anyone who has a reasonable
  amount of

  process and instrumentation knowledge, and who is reviewing documents depicting
  measurement and

  control, to understand the means and purpose of the instrumentation shown.

  2.3.3 The detailed knowledge of a specialist in instrumentation and/or control systems
  is not a

  prerequisite to understanding this standard.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
