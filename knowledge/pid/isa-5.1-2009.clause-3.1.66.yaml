source_status: normative
explanation: '3.1.66 transmitter:

  a device that senses a process variable through the medium of a sensor or measuring
  element and has

  an output whose steady-state value varies only as a predetermined function of the
  process variable.

  a) the sensor can be an integral part, as in a direct-connected pressure transmitter,
  or a separate

  part, as in a thermocouple.'
