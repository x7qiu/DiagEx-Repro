catalog:
  role: supporting
  short_name: Valve bodies, actuators and assemblies
  interpretation: 'Valve bodies and actuators are separate graphical components which
    can form an assembly. Users document their chosen symbols. Read the actual combination:
    a valve body alone does not establish its actuator, control function or failure
    action. Source notes include specific combination rules; retain ambiguity if a
    combination is unsupported. The source''s note (4) lists actuator items 13-15
    for on-off solenoid valves while note (8) lists 17-19; do not silently reconcile
    those statements. Item 21 denotes a motor controlling a process variable; an actuator
    combination may represent variable-speed control.'
