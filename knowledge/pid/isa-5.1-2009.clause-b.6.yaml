explanation: 'B.6 Instrument diagram and functional diagram example

  B.6.1 Process Flow Diagrams (PFDs) are developed by process engineers to provide
  basic process

  data and to describe process operation. Simple instrument diagrams are used to indicate
  the

  primary process control measurements and controlled streams required to operate
  the process.

  Process monitoring and alarm points and secondary and auxiliary controls and monitors
  are not

  shown but are added during the detailed process design and P&ID development.

  B.6.2 A simple flow control requirement should be shown on a PFD as:

  FC

  a) Instrument tag numbers should not be assigned on PFDs.

  B.6.3 A typical instrument diagram developed from the PFD diagram:

  I/P

  FIC FY

  *01

  *01-A

  FT

  FY

  FE

  FV

  *01

  *01-B

  *01

  *01

  a) Bubbles [FE-*01] and [FY-01-B] are optional and not recommended.

  b) Bubble [FV-*01] is optional but is recommended.

  B.6.4 Typical equipment and function-oriented functional diagrams developed from
  the PFD diagram:

  FT

  FT

  *01

  *01

  ∆

  ∆

  I P

  I P

  A A T

  A A T

  ƒ(x)

  ƒ(x)

  FV-*01

  FV-*01

  Function oriented

  Equipment oriented'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
