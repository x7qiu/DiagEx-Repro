explanation: 'A.1 Identification system

  A.1.1 This informative annex to the standard describes a common and almost universally
  used

  Identification System for monitoring and control instrument devices and functions
  that is logical,

  unique, and consistent in application with a minimum of exceptions, special uses,
  or

  requirements.

  A.1.2 An identification system is required to identify instrumentation in text and
  in sketches and

  drawings when used with graphic symbols as described in Annex B.

  A.1.3 The Identification System provides methods for identifying instrumentation
  required to monitor,

  control, and operate a processing plant, unit operation, boiler, machine, or any
  other system that

  requires measurement, detection, indication, control, modulation, and/or switching
  of variables or

  states.

  A.1.4 The methods shown are based on the most common ones now in use in the chemical
  and

  refining process industries.

  A.1.5 Any different methods in use in these industries should be:

  a) Revised to conform to this annex.

  b) Submitted to ISA (email to standards@isa.org) to determine if they are to be:

  1) Included in the next revision of this standard.

  A.1.6 ISA should be advised of differences that are normal practice in other industries
  so that these

  methods can be incorporated into the next revision of this standard.

  A.1.7 A multi-component monitor or control loop consists of some or all of the following
  (as indicated):

  a) Measurement or detection of process variable or state (monitor and control):

  1) Measurement element, such as an orifice plate or thermocouple.

  2) Measurement transmitter or indicator:

  a) With an integral-measuring element, such as a pressure-actuated

  transmitter or gauge.

  b) With a non-integral-measuring element, such as a thermocouple-

  actuated temperature transmitter or gauge.

  b) Conditioning of measurement or input signal (monitor and control):

  1) Calculating devices.

  2) Calculating functions.

  c) Monitoring of process variable (monitor):

  1) Indicating or recording device.

  2) Application software display function.

  d) Controlling of process variable (control):

  1) Indicating or recording control device.

  2) Application software control function.

  e) Conditioning of controller or output signal (control):

  1) Calculating devices.

  2) Calculating functions.

  f) Modulation of controlled variable (control):

  1) Control valve modulation or on-off action.

  2) Resetting another control loop setpoint.

  3) Limiting another control loop output signal.

  A.1.8 A loop number is assigned to each group of components required to perform
  the desired function

  of the monitor or control scheme.

  A.1.9 A single component monitor or control loop consists of some or all of the
  following:

  a) Self-acting measuring and control devices, such as pressure or temperature control

  valves.

  b) Self-acting measuring and control devices, such as pressure or temperature safety

  valves.

  c) Single point monitoring devices, such as pressure or temperature gauges.

  A.1.10 Each single component may be assigned:

  a) A unique loop number, indexed with the plant instrumentation.

  b) An instrument tag number, indexed separate from the primary plant instrumentation.

  c) A coded type number.'
