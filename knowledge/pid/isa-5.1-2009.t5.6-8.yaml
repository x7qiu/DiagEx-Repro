interpretation:
- The panels retain all source alternatives and annotations; they are not tight drawing-object
  bounding boxes.
- Item numbers, method labels, note markers, equations, and illustrative tags are
  not automatically symbol geometry or actual drawing tags.
- Apply each placeholder according to its own row and linked notes. Asterisks, question
  marks, letters, and numbers do not have one universal meaning.
- Assign text, ports, coordinates, and connections only from the drawing occurrence;
  preserve uncertainty.
