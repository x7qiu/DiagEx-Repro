explanation: '• Transmitter with remote primary element inserted in or on process
  flow line, vessel, or equipment, bubble/graphic format. • Insert primary element
  symbol from Table 5.2.3 at #. • Connecting line may be any signal line from Table
  5.2.3. • Connecting line shall be equal to or greater than 0.5 inches (12 millimeters).
  • Connect to other instruments by symbols from Table 5.3.2.'
