kind: definition
curation: source_transcribed
source_status: normative
explanation: '3.1.29 distributed control system (DCS):

  instrumentation, input/output devices, control devices and operator interface devices,
  which in addition to

  executing stated control and indication functions, also permit transmission of control,
  measurement, and

  operating information to and from single or multiple-user specifiable locations,
  connected by single or

  multiple communication links.'
