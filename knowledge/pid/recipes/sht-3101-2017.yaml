  - 143
  - 1225
  - 1045
  - 1541
  name: 仪表系统、位置与文字 / Instrument system, location and text conventions
  table: '4.6'
  explanation: Table 4.6 distinguishes DCS (circle in square), SIS (diamond in square), third-party systems
    (diamond in square with system-type text), and individual instruments (circle). Horizontal solid/dashed
    and single/double lines encode installation/display location as specified by each row. *** is a system-type
    placeholder, not symbol geometry. When a tag cannot fit, the instrument frame may be broken or extended.
    Example letters and digits in these notes are not actual tags. The drafting diameter is 10–12 mm,
    not a pixel threshold.
- id: letter-rules
  page: 15
  rect:
  - 185
  - 203
  - 1070
  - 787
  name: 仪表字母解释 / Instrument-letter interpretation
  table: 4.4 notes
  explanation: The first letter identifies the directly measured/initiating variable, optionally with
    a modifier. A denotes material-composition or physical-property analysis, while vibration/mechanical
    analysis uses V. User-defined letters N and O require consistent project definitions. Modifiers D,
    F and Q stay in the same variable numbering sequence. For readout/passive functions, G identifies
    glass/local direct viewing and I indirect observation. These rules interpret observed text; they cannot
    supply missing tags. See the letter table source image for the complete mapping.
