  notes:
  - marker: a
    text: 首位字母代表被测/初始变量；当需要的时候，它也可以是被测/初始变量和变量修饰词的组合以表达组合意义；
    source:
      document: SH/T 3101—2017 石油化工流程图图例
      page: '11'
      edition: '2017'
      image: illustrations/sht-3101-2017/letter-table/complete-notes.png
      document_id: sht-3101-2017
      pdf_page: 15
      table: '4.4'
      passage: Table 4.4 explanatory notes
      item: a
  - marker: b
    text: 仪表编号时应把可被直接测量的变量作为被测/初始变量，不应把通过对直接测量的变量进行推导、运算而得出的变量作为被测/初始变量；
    source:
      document: SH/T 3101—2017 石油化工流程图图例
      page: '11'
      edition: '2017'
      image: illustrations/sht-3101-2017/letter-table/complete-notes.png
      document_id: sht-3101-2017
      pdf_page: 15
      table: '4.4'
      passage: Table 4.4 explanatory notes
      item: b
  - marker: c
    text: “A”作为首位字母使用时代表对于所有类型的物流组分及物理参数的分析，分析仪的类型和被测物流中的分析项目（成分）可以标注在仪表圆圈外；
    source:
      document: SH/T 3101—2017 石油化工流程图图例
      page: '11'
      edition: '2017'
      image: illustrations/sht-3101-2017/letter-table/complete-notes.png
      document_id: sht-3101-2017
      pdf_page: 15
      table: '4.4'
      passage: Table 4.4 explanatory notes
      item: c
  - marker: d
    text: “A”作为首位字母使用时不得代表对于振动和其他机械类物理参数的分析，这类分析通常使用“V”作为首位字母来表示，把振动作为被测/初始变量或用“V”作为首位字母倾向于指对机械物理参数的监测；
    source:
      document: SH/T 3101—2017 石油化工流程图图例
      page: '11'
      edition: '2017'
      image: illustrations/sht-3101-2017/letter-table/complete-notes.png
      document_id: sht-3101-2017
      pdf_page: 15
      table: '4.4'
      passage: Table 4.4 explanatory notes
      item: d
  - marker: e
    text: 因未被定义而作为“供选用”的字母：“N”和“O”，当其被选用时，它作为首位字母和后继字母应具有不同的意义并且只能被使用者定义一次。例如，“N”作为首位字母时，可规定其意义为“弹性模数”；作为后继字母，可规定为“示波器”；
    source:
      document: SH/T 3101—2017 石油化工流程图图例
      page: '11'
      edition: '2017'
      image: illustrations/sht-3101-2017/letter-table/complete-notes.png
      document_id: sht-3101-2017
      pdf_page: 15
      table: '4.4'
      passage: Table 4.4 explanatory notes
      item: e
  - marker: f
    text: 带有修饰词“D”、“F”、“Q”等的变量，应与不带修饰词的变量合在一起编写仪表位号，不作为单独的变量另行编写仪表位号；例如：温差指示仪 TDI-105 应与温度指示仪 TI-104，温度指示调节
      TIC-106 按统一顺序编写仪表位号；
    source:
      document: SH/T 3101—2017 石油化工流程图图例
      page: '11'
      edition: '2017'
      image: illustrations/sht-3101-2017/letter-table/complete-notes.png
      document_id: sht-3101-2017
      pdf_page: 15
      table: '4.4'
      passage: Table 4.4 explanatory notes
      item: f
  - marker: g
    text: 对于读出/被动功能，使用字母“G”代替字母“I”来表征玻璃视镜和现场直读设备，如玻璃板液位计、压力表、双金属温度计和流量视镜；而字母“I”用于表征间接观察的仪表或设备。
    source:
      document: SH/T 3101—2017 石油化工流程图图例
      page: '11'
      edition: '2017'
      image: illustrations/sht-3101-2017/letter-table/complete-notes.png
      document_id: sht-3101-2017
      pdf_page: 15
      table: '4.4'
      passage: Table 4.4 explanatory notes
      item: g
  - marker: '8'
    status: unresolved
    text: The scan prints (8) after Unclassified in the X readout cell. The accompanying notes are lettered
      a-g; a matching note (8) has not been identified in these source pages. Do not substitute ISA note
      (8).
    source:
      document: SH/T 3101—2017 石油化工流程图图例
      page: '10'
