explanation: '3.1 Definitions

  For the purposes of this standard, the following definitions apply. For additional
  information, see

  ISA-51.1-1979 (R 1993), “Process Instrumentation Terminology,” and ANSI/ISA-75.05.01-2000
  (R 2005),

  “Control Valve Terminology.” Terms italicized in a definition are themselves defined
  elsewhere in this

  clause.'
