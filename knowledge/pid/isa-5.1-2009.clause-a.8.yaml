curation: source_transcribed
source_status: informative
explanation: 'A.8 Instrument identification/tag number

  A.8.1 An Instrument Identification/Tag Number is a unique combination of letters
  and numbers that is

  assigned to define the purpose of each loop device and/or function that comprises
  a monitoring or

  control loop.

  A.8.2 Adding a Variable Modifier, if needed, and Succeeding Letters to the Loop
  Identification Number

  letters forms an Instrument Identification/Tag Number.

  A.8.3 Instrument Identification/Tag Numbers may also be called Instrument Identification
  Number,

  Instrument Tag Number, Instrument Number, or Tag Number.'
