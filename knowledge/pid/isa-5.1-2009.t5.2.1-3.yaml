explanation: • Transmitter with close coupled primary element, bubble format • Notation
  (*) from Table 5.2.2 should be used to identify type of element. • Connecting line
  shall be equal to or less than 0.25 inches (6 millimeters). • Connect to process
  or other instruments by symbols from Tables 5.3.1 and 5.3.2. • Insert element in
  or on process flow line, vessel, or equipment.
