  explanation: '5.3.2 Tables 5.2.1, 5.2.2, 5.2.3, 5.2.4, and 5.2.5 — Measurement symbols

    (1) Measurements are depicted by:

    (a) Bubbles only.

    (b) Bubbles and graphics.

    (2) These symbols shall be used for process or equipment measurements if:

    (a) A graphic symbol does not exist.

    (b) The user does not use graphic symbols.

    (3) Transmitter [T] may be controller [C], indicator [I], recorder [R], or switch
    [S].

    (4) User engineering and design standards, practices, and/or guidelines shall
    document which

    choices are selected.'
  asset_id: clause-5.3.2-p33
