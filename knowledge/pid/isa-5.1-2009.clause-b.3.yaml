explanation: 'B.3 Examples of graphic symbols with assigned instrument/tag numbers

  B.3.1 Instrument bubble symbols should use the upper half of each symbol for Functional
  Identification

  Letters and the lower half of each symbol for Loop Numbers:

  a) Five (5) characters or less:

  ABCDE

  98765

  b) Six (6) characters or more, relieve sides of bubble or enlarge bubble as required:

  ABCDEFGHJKLM

  ABCDEFGHJKLM

  9876543210

  9876543210

  B.3.2 Functional diagramming, binary logic, and electrical schematic symbols should
  be tagged at

  either (A), (B), (C), or (D):

  (A)

  (A)

  (A)

  (A) (B)

  A

  (B) (A) (C)

  K

  ∆

  A

  B

  (B) (A)

  (B)

  ∆ N

  ∫ C O

  D I

  P D

  (C)

  d/dt

  (B) (B) (D)

  X

  (D) (D) (A) (C)

  (B)'
