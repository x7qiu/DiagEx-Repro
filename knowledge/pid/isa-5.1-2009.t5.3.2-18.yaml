text_slots:
- role: input_reference
  example_marker: (*)
  location: left of terminal stroke
  meaning: Input description, source, or instrument tag
interpretation:
- Placeholder marks represent variable text, not literal identifiers to copy into
  drawing results.
- Row numbers, alternative labels a)/b), and parenthesized note (3) are reference
  annotations, not symbol parts.
- Retain uncertainty when the source glyph or actual text does not support a specific
  interpretation.
- A logic-diagram input/output mark alone does not prove an off-page continuation;
  do not force an equipment or piping-node classification.
