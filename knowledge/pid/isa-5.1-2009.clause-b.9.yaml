explanation: 'B.9 Common instrument-to-instrument signal connections

  B.9.1 Pneumatic discrete instrumentation:

  FRC FT

  FV *01

  *01

  *01

  B.9.2 Electronic discrete instrumentation:

  FRC FT

  FV

  *01 *01

  *01

  B.9.3 Shared display, shared control instrumentation:

  FT FRC

  FV

  *01 *01

  *01

  B.9.4 Shared display, shared control instrumentation, with diagnostic and calibration
  bus on field wiring:

  FT FRC

  FV

  *01 *01

  *01

  B.9.5 Shared display, shared control and wireless instrumentation:

  FT FRC

  FV

  *01 *01

  *01

  B.9.6 Shared display, shared control instrumentation, primary and alternate systems,
  no inter-bus

  communication:

  FT FRC

  FV

  *01 *01

  DCS-1

  *01

  FT FRC

  FV

  *11 *11

  DCS-2

  *01

  B.9.7 Shared display, shared control, primary and alternate systems, with inter-bus
  communication:

  FI

  *11

  DCS-2

  FT FC

  FV

  *01 *01

  DCS-1

  *01

  FI

  *11

  DCS-1

  FT FC

  FV

  *11 *11

  DCS-2

  *01

  B.9.8 Shared display, shared control and fieldbus instrumentation, inter-bus communication:

  a) Fieldbus transmitter/controller and electronic valve positioner:

  FK FI

  SP

  *01 *01

  FC

  FV

  *01

  *01

  b) Fieldbus valve positioner/controller and electronic transmitter:

  FI FK SP

  *01 *01

  FC

  FT

  *01

  FV

  *01

  *01

  c) Fieldbus transmitter and valve positioner/controller:

  FI FK SP

  *01 *01

  FC

  *01 FT

  FV

  *01

  *01

  B.9.9 Fieldbus valve positioner/controller, transmitter, and indicator:

  FI

  *01

  FC

  *01 FT

  FV

  *01

  *01

  B.9.10 Fieldbus integral transmitter, controller, and valve positioner:

  FI FK

  101 101

  FC

  101

  24VDC

  B.9.11 Instrument and functional diagrams should not be used to specifically identify
  signal tubing,

  wiring, and bus construction methods used to implement a monitoring and control
  system.'
