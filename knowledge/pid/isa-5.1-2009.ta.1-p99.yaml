  passage: "      Table A.1 — Typical Loop and Instrument Identification/Tag Numbers\n\
    \n\nNote: Numbers in parentheses refer to explanatory notes in Clause A.16.1.\n\
    \n                              Example: Differential pressure loop with a low\
    \ alarm.\n\n                            Typical Measured/Initiating Variable Loop\
    \ Number – 10-P-*01A (1)\n                                    (Loop Numbering\
    \ Schemes: 1, 4, or 7)\n\n    10      -   P      -   *01  A                  \
    \                    Loop Identification Number            [A.4] (2)\n\n     \
    \                   A                       A            Loop Number Suffix  \
    \              [A.10]\n\n                         *01                        \
    \          *01     Loop Identification Number numerals        [A.6]\n\n      \
    \                          -                                                 \
    \             -              Optional Punctuation                [A.11]\n\n  \
    \          P                                  P        Measured/Initiating Variable\
    \ letter          [A.5]\n\n                -                                 \
    \                                             -              Optional Punctuation\
    \                [A.11]\n\n    10                                            \
    \      10            Loop Number Prefix                  [(A.7)]\n\n         \
    \                          Typical First Letters Loop Number – AB-PD-*01A (1)\n\
    \                                 (Loop Numbering Schemes: 2, 3, 5 , 6, 8, or\
    \ 9)\n\n   AB     -   P   D      -   *01  A                                 Loop\
    \ Identification Number            [A.4] (2)\n\n                            A\
    \                   A            Loop Number Suffix                [A.10]\n\n\
    \                               *01                            *01     Loop Identification\
    \ Number numerals        [A.6]\n\n                                        -  \
    \                                                    -              Optional Punctuation\
    \                [A.11]\n\n               D                            D     \
    \        Variable Modifier letter                [A.5]\n\n            P      \
    \                            P        Measured/Initiating Variable letter    \
    \      [A.5]\n\n            P   D                             PD             \
    \        First Letters                      [A.5]\n\n                -       \
    \                                                                       -    \
    \    Recommended Punctuation            [A.11]\n\n   AB                      \
    \                   AB           Loop Number Prefix                  [A.7]\n\n\
    \                          Typical Instrument Identification/Tag Number – 10-PDAL-*01A-1A1\
    \ (1)\n\n    10      -   P   D   A    L       -   *01  A      -    1   A1    \
    \  Instrument Identification/Tag Number       [A.8] (2)\n\n                  \
    \                                 A1         Additional Tag Number Suffixes  \
    \        [A.10]\n\n                                                    1    1\
    \               First Tag Number Suffix              [A.10]\n\n              \
    \  -                                                              -          \
    \     -        Recommended Punctuation            [A.11]\n\n                 \
    \                  A           A            Loop Number Suffix               \
    \ [A.10]\n\n                                         *01                  *01\
    \     Loop Identification Number numerals        [A.6]\n\n                   \
    \                                     -                                      -\
    \              Optional Punctuation                [A.11]\n\n                \
    \            L                           L             Function Modifier letter\
    \                [A.9]\n\n                    A                           A  \
    \        Function Identification letter              [A.9]\n\n               \
    \     A    L                        AL             Succeeding Letters        \
    \          [A.9]\n\n               D                            D       Variable\
    \ Modifier letter (if required)          [A.5]\n\n            P              \
    \                    P        Measured/Initiating Variable letter          [A.5]\n\
    \n            P   D   A    L                              -      PDAL        Function\
    \ Identification letters             [A.9]\n\n                -              \
    \                                                                -           \
    \   Optional Punctuation                [A.11]\n\n    10                     \
    \                             10            Loop Number Prefix               \
    \   [A.7]"
