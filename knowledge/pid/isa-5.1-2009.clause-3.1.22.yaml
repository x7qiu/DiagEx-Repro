source_status: normative
explanation: '3.1.22 converter:

  a device that receives information as one form of an instrument signal and transmits
  an output signal as

  another form, such as a current-to-pneumatic signal converter.

  a). an instrument that changes a sensor’s output to a standard signal, is properly
  designated as a

  transmitter, not a converter; typically, a temperature element [TE] connects to
  a transmitter [TT], not to a

  converter [TY].

  b) a converter is sometimes referred to as a transducer, a completely general term
  not

  recommended for signal conversion.'
