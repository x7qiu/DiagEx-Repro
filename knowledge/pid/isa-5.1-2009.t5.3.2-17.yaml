id: isa-5.1-2009.t5.3.2-17
version: 3
concept: Drawing-to-drawing signal connector
aliases:
- 跨图信号连接符
- signal continuation
reference_type: symbol
kind: definition
explanation: Carries a signal between drawings. The table describes signal flow from
  left to right and shows rounded and pointed alternatives. The upper field identifies
  the sending or receiving instrument; the lower field identifies the other drawing
  or sheet.
exceptions:
- This defines signal notation, not process-piping connectivity.
- Use the explicit drawing legend when it differs; shape alone does not prove a connection.
