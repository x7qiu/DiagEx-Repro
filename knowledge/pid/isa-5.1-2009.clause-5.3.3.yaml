catalog:
  role: supporting
  short_name: Signal and connection notation
  interpretation: 'Signal arrows clarify direction when needed; absence of an arrow
    does not establish direction. Projects document their selected alternatives. Signal
    connectors are distinct from process-piping connectors. System-bus, independent-system,
    fieldbus and remote calibration links have different meanings: use the line definition
    and drawing evidence. Power supplies are indicated when nonstandard, independently
    required, or affected by controller/switch actions. Do not infer missing supplies
    or connections.'
