explanation: 'B.7 Process variable measurements

  B.7.1 Process variable measurement devices are inserted in or mounted on pipelines
  and equipment to

  measure a physical property or to analyze a chemical composition, and include but
  are not limited

  to:

  a) Primary elements, such as orifice plates and thermocouples, that generate analog

  signals, position mechanical devices, or are used by transmitters to generate signals

  compatible with the control system.

  b) Transmitters with integral primary elements, such as vortex shedding flowmeters
  and

  filled-capillary temperature devices that generate signals compatible with the control

  system.

  B.7.2 Process measurements are indicated by:

  a) Bubbles as shown in Table 5.2.1 for:

  1) Generic primary elements.

  2) Primary elements that do not have a graphic symbol in Table 5.2.3.

  3) Users who elect not to use graphic symbols from Table 5.2.3.

  b) Graphic symbols from Table 5.3.2.

  B.7.3 Analyzer primary element located in a process slip stream or in a process
  stream or equipment

  with or without accessory devices, such as sample conditioners that contain components
  that are

  not normally shown, and with type of analyzer and component of interest noted at
  (**) and (***)

  respectively:

  a) With sample conditioners:

  TC

  VENT

  (**)

  AE

  AE

  or

  *01

  DRAIN *02

  C2

  (***)

  VENT C3

  AX

  AX

  or

  *01

  *02

  DRAIN SMPL SMPL

  COND COND

  b) Without sample conditioners:

  TC (**)

  VENT

  AE AE

  or

  *01 *02

  DRAIN

  C2

  (***)

  C3

  c) Analyzer primary element or transmitter inserted in process stream or equipment:

  MOIST pH

  AE AE

  *03 *04

  B.7.4 Orifice plate primary elements, with or without optional flow arrow, use generic
  orifice plate

  symbol with transmitter bubble connected to indicate orifice tap location for flange
  taps, corner

  taps, pipe taps, and vena contracta taps respectively:

  a) Single process connection: corner taps, pipe taps, and vena contracta taps are
  indicated

  by notation:

  FT FT FT FT

  *01 *01 *01 *01

  CT VC PT

  b) Double process connection, pipe taps and vena contracta taps are indicated by
  notation:

  FT FT FT FT

  *02 *03 *03 *01

  PT VC

  B.7.5 Process root block valves should be shown as required by the piping engineering
  group.

  B.7.6 Orifice meter tubes or runs that are specified and requisitioned by the instrument
  group should be

  shown on drawings and sketches by:

  a) Bubble:

  FX

  *01

  NOTES

  b) Notation:

  1. METER TUBE BY INSTRUMENTS.

  NOTE 1

  c) Flanged or welded:

  METER TUBE METER RUN'
