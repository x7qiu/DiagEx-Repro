  short_name: 故障锁定后趋向关 FLC
  interpretation: 故障锁定后趋向关 FLC / Fail at last position, then drift closed. Defined by SH/T 3101:2017,
    Table 4.8, item 5. Failure here means loss of valve function, including air-supply or hydraulic-fluid
    failure. The illustrated arrows describe failure movement, not process-flow direction. The two images
    are alternative notations for the same condition. The valve first holds its last position, then drifts
    as stored energy is depleted; retain this distinction from immediate fail-open/fail-closed. Each labeled
    alternative is a separate reference depiction, not an additional object to instantiate.
