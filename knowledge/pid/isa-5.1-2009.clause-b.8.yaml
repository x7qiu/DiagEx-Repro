explanation: 'B.8 Final control elements

  B.8.1 Final control elements installed in pipelines and equipment modulate or manipulate
  the process

  stream or equipment to affect the loop measured variable.

  B.8.2 Final control elements include, but are not limited to, control valves, solenoid
  valves, louvers,

  dampers, motors, variable speed drives, and machine components.

  B.8.3 Control valves are generally pneumatically operated and furnished with positioners
  that may:

  a) Be actuated by a pneumatic or an electronic signal.

  b) Not be shown if all control valves are furnished with positioners.

  B.8.4 Control valves with pneumatic or electronic signal:

  a) Without positioner: I/P

  FY

  *01

  FV FV

  *01 *01

  b) With positioner:

  1) Cross-hatches from positioner to actuator are optional.

  c) With tripping solenoid, with and without positioner:

  LSL LSL

  S S

  *11 *11

  FV

  FV

  *01

  *01

  B.8.5 Instrumentation with integral components that:

  a) Measure process variables and transmit control and other functions as an integral
  part of

  a transmitter:

  FC

  *01

  FC FT

  *01 *01

  b) Manipulates control valves as an integral part of a control valve positioner:

  FC

  *017

  c) Is an integral assembly that contains a transmitter, a controller, and a control
  valve:

  FC

  101

  FV FT

  101 101

  24VDC 24VDC'
