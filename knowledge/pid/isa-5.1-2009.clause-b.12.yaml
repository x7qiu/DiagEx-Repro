explanation: 'B.12 Multipoint, multivariable and multifunction instruments

  B.12.1 Multipoint instruments are single or multivariable indicators or recorders
  that receive input signals

  from two (2) or more primary elements or transmitters.

  B.12.2 Multivariable instruments are controllers that receive input signals from
  two (2) or more primary

  elements or transmitters and control one (1) manipulated variable.

  B.12.3 Multifunction instruments are controllers that receive input signals from
  two (2) or more primary

  elements or transmitters and control two (2) or more manipulated variables.

  B.12.4 Single variable or multivariable multipoint recorders for two (2) or three
  (3) points are drawn with

  bubbles either:

  a) Tangent to each other in the same order, left to right, as the pen or pointer
  assignments:

  FR TR PR

  *10 *08 *11

  PT TT FT

  *11 *08 *10

  b) Separate from each other with pen number indicated and a note defining the multipoint

  instrument:

  PEN #1 PEN #3 PEN 2

  NOTE 1. FR PR TR

  PEN IN RECORDER,

  *10 *11 *08

  FR*10/PR*11/TR*08.

  NOTE 1 NOTE 1 NOTE 1

  PT TT FT

  *11 *08 *10

  B.12.5 Multipoint indicators and recorders for four (4) or more points are drawn
  with bubbles separate

  from each other, with point number indicated by adding a suffix to the tag numbers:

  a) Single variable:

  TI TE

  TI TI TE TE TI

  TE

  *01-04 *01-04

  *01-03 *01-01 *01-03 *01-01 *01-02

  *01-02

  b) Multivariable:

  UJI TE

  UJI UJI LT TE UJI

  PT

  *01-04 *01-04

  *01-03 *01-01 *01-03 *01-01 *01-02

  *01-02

  B.12.6 A multivariable controller example drawn with bubbles for each measured variable
  input, the

  output to the final control element, and measured variable indicators:

  PI TI LI FI

  PT

  *11 *51 21 *71

  *11

  TT

  *51

  UC

  *01

  LT UV

  *01 *21

  FT

  FO

  *71

  B.12.7 variable multifunction controller example drawn with bubbles for measured
  variable inputs,

  controller and indicator functions, and final control elements, for example:

  PT

  L1 TI

  *11

  21 *51

  TT

  *51

  FC UU SP

  *71 *01

  FV

  LT *71

  *21 UV

  FT

  *01

  *71

  FO

  FO'
