  explanation: '5.3.3 Tables 5.3.1 and 5.3.2 — Line symbols:

    (1) Power supplies shall be shown when:

    (a) Different from those normally used, e.g., 120 Vdc when normal is 24 Vdc.

    (b) When a device requires an independent power supply.

    (c) Affected by controller or switch actions.

    (2) Arrows shall be used if needed to clarify direction of signal flow.

    (3) Users engineering and design standards, practices and/or guidelines shall
    document which

    symbol has been selected.

    (4) The line symbols connect devices and functions that are integral parts of
    dedicated systems,

    such as distributed control systems (DCS), programmable logic controllers (PLC),
    personal computer

    systems (PC), and computer control systems (CCS) over a dedicated communication
    link.

    (5) The line symbols connect independent microprocessor-based and computer-based
    systems to

    each other over a dedicated communications link, using but not limited to the
    RS232 protocol.

    (6) The line symbols connect “intelligent” devices, such as microprocessor-based
    transmitters and

    control valve positioners that contain control functionality, to other such devices
    and to the

    instrumentation system, using but not limited to Ethernet fieldbus protocols.

    (7) The line symbols connect “smart” devices, such as transmitters, to instrumentation
    system input

    signal terminals and provide a superimposed digital signal that is used for instrument
    diagnostics and

    calibration.'
  asset_id: clause-5.3.3-p33
