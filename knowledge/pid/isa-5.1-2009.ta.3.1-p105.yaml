  explanation: 'A.16.3 Tables A.3.1 and A.3.2 — Allowable succeeding letter combinations
    for readout/passive and

    output/active function letters and first-letters.

    (1) Cells marked NA indicate not allowable combinations.

    (2) First Letters are assigned according to Table A.2.

    (3) Function Modifiers are added where indicated to right of alarm function combinations.

    (4) Users should assign, as needed, meanings to:

    (a) Users Choice Function letters [B] and [N].

    (b) Readout/Passive Function blanks [C], [D], [F], [H], [J], [K], [M], [S], [T],
    [V], [Y], and [Z].

    (c) Output/Active Function blanks [A], [D], [E], [F], [G], [H], [I], [J], [L],
    [M], [O], [P], [Q], [R],

    and [W].

    (d) Function Modifier blanks [A], [E], [F], [G], [I], [J], [K], [P], [Q], [T],
    [U], [V], [W], [Y], and [Z].

    (5) Readout/Passive Function [G] (glass, gauge) is used for local direct connected
    devices, such as

    flow sight glasses, level glasses, pressure gauges, thermometers weigh scales
    and position

    indicators. These devices provide a simple view of a process condition.

    (a) Readout/Passive Function [I] (indicate) may continue to be used in facilities
    where it is

    currently used.

    (6) Pressure rupture disc [PSE] and fusible link [TSE] apply to all sensors or
    primary elements

    intended to protect against emergency pressure or temperature conditions.

    (7) The combinations in the [C] column are used for:

    (a) Discrete single case instruments that do not have operator-visible indication
    of measured

    variable, setpoint, or output signal.

    (b) Controller functions configured in shared display, shared control systems
    where

    indication and recording are configurable functions available on demand.

    (8) The combinations in the [IC] and [RC] columns indicate the order to be followed
    in forming the

    Functional Identification of a controller device or function that also provides
    indication or

    recording.

    (9) The combinations in the [CV] column indicate the order to be followed in forming
    the Functional

    Identification for self-actuated control valves.

    (10) Flow safety valve [FSV] applies to valves intended to protect against an
    emergency excess flow

    or loss of flow condition. Pressure safety valve [PSV], and temperature safety
    valve [TSV] apply

    to valves intended to protect against emergency pressure and temperature conditions

    (11) A self-actuated pressure valve that prevents operation of a fluid system
    at a higher-than-desired

    pressure by bleeding fluid from the system is a backpressure control valve [PCV],
    even if the

    valve is not normally used.

    (a) This valve should be designated a pressure safety valve [PSV] if it protects
    against

    emergency conditions hazardous to personnel and/or equipment that are not expected
    to arise

    normally.'
