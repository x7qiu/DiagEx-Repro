explanation: '2.1 General

  2.1.1 This standard is intended to meet the different procedures of various users
  who need to identify

  and graphically depict measurement and control equipment and systems. These differences
  are

  recognized when they are consistent with the objectives of this standard, by providing
  alternative symbol

  and identification methods.

  2.1.2 A limited number of examples are provided that illustrate how to:

  a) Design an identification system and construct an identification number.

  b) Use graphic symbols to construct:

  1) Instrumentation schematic diagrams of the instruments, devices, and functions

  required for monitoring and control loops.

  2) Functional diagrams of instruments, loops, and application software functions.

  3) Binary logic diagrams.

  4) Ladder diagrams of electrical circuits.

  c) Add information and simplify diagrams.

  2.1.3 Examples of identification and symbol applications are intended to illustrate
  basic concepts in the

  construction of the identification systems and diagrams covered by this standard
  that are applicable to all

  user industries.'
