catalog:
  role: supporting
  short_name: Measurement element notation
  interpretation: Measurements may use bubbles alone or bubbles with graphics. Bubble
    notation is used when a graphic is unavailable or the project does not use graphics.
    The transmitter function T in examples may instead be controller C, indicator
    I, recorder R, or switch S as supported by the drawing. The project documents
    its selected conventions. A depicted transmitter and primary element may be multiple
    components, not one object bounding box.
