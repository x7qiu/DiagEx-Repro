source_status: normative
explanation: '3.1.36 instrument:

  a device used for direct or indirect measurement, monitoring, and/or control of
  a variable, including

  primary elements, indicators, controllers, final control elements, computing devices,
  and electrical devices

  such as annunciators, switches, and pushbuttons.

  a) the term does not apply to a devices internal components or parts, such as receiver
  bellows or

  resistors.'
