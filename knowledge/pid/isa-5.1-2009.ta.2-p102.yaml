notes:
- source:
    document_id: isa-5.1-2009
    document: ANSI/ISA-5.1-2009
    edition: '2009'
    page: 96, 97
    pdf_page: 96
    table: null
    item: null
    passage: Clause A.16.2
    image: illustrations/isa-5.1-2009/complete/clause-a.16.2-p96.png
  explanation: 'A.16.2 Table A.2 — Allowable letter/number combinations for loop numbering
    schemes.

    (1) First Letters do not include all possibilities.

    (2) Replace asterisk in Loop Number with any digit from 0 to 9 or any combination
    of numerals.

    (3) Variable Modifier safety instrumented system [Z] is technically not a direct-measured
    variable but

    is used to identify loops in a Safety Instrumented System. And because of the
    critical nature of

    such loops, any Measured/Initiating Variable followed by [Z], such as [FZ], [PZ],
    and [TZ], should

    be considered as Measured/ Initiating Variables in all Loop Identification Number
    construction

    schemes

    (a) An alternate method for identifying Safety Instrumented System loops is to
    append [(SIS)]

    outside the bubbles of Safety Instrumented System loops and as a prefix or suffix
    to the Loop

    Number when used in text. For example, Loop Numbers for pressure and temperature
    loops in an

    SIS may be [(SIS)PZ-*01] or [TZ-*09(SIS)].

    (4) Users should assign, as needed, meanings to:

    (a) Users Choice Measured/Initiating Variable letters [C], [D], [G], [M], [N],
    and [O].

    (b) Variable Modifier letter blanks [A], [B], [C], [E], [G], [H], [I], [L], [M],
    [N], [O], [P], [R], [T],

    [U], [V], and [W].

    (5) Variable Modifier safety [S] is technically not a direct-measured variable
    but is used to identify

    self-actuated emergency protective primary and final control elements only when
    used in

    conjunction with Measured/Initiating Variables flow [F], pressure [P] or temperature
    [T]. And

    because of the critical nature of such devices, [FS], [PS], and [TS] should be
    considered as

    Measured/ Initiating Variables in all Loop Identification Number construction
    schemes:

    (a) Shall not be used to identify Safety Instrumented Systems and components.

    (6) Measured/Initiating Variables [V], [W], or [Z] when used in a Safety Instrumented
    System and:

    (a) Not axially oriented should use [VZ], [WZ], and [ZZ] as Measured/Initiating
    Variables.

    (b) Axially oriented should use [VZX], [VZY], [VZZ], and [WZX], [WZY], [WZZ] and
    [ZZX],

    [ZZY], [ZZZ] as Measured/Initiating Variables.'
  asset_id: clause-a.16.2-p96
- source:
    document_id: isa-5.1-2009
    document: ANSI/ISA-5.1-2009
    edition: '2009'
    page: 97, 98
    pdf_page: 97
    table: null
    item: null
    passage: Clause A.16.3
    image: illustrations/isa-5.1-2009/complete/clause-a.16.3-p97.png
  explanation: 'A.16.3 Tables A.3.1 and A.3.2 — Allowable succeeding letter combinations
    for readout/passive and

    output/active function letters and first-letters.

    (1) Cells marked NA indicate not allowable combinations.

    (2) First Letters are assigned according to Table A.2.

    (3) Function Modifiers are added where indicated to right of alarm function combinations.

    (4) Users should assign, as needed, meanings to:

    (a) Users Choice Function letters [B] and [N].

    (b) Readout/Passive Function blanks [C], [D], [F], [H], [J], [K], [M], [S], [T],
    [V], [Y], and [Z].

    (c) Output/Active Function blanks [A], [D], [E], [F], [G], [H], [I], [J], [L],
    [M], [O], [P], [Q], [R],

    and [W].

    (d) Function Modifier blanks [A], [E], [F], [G], [I], [J], [K], [P], [Q], [T],
    [U], [V], [W], [Y], and [Z].

    (5) Readout/Passive Function [G] (glass, gauge) is used for local direct connected
    devices, such as

    flow sight glasses, level glasses, pressure gauges, thermometers weigh scales
    and position

    indicators. These devices provide a simple view of a process condition.

    (a) Readout/Passive Function [I] (indicate) may continue to be used in facilities
    where it is

    currently used.

    (6) Pressure rupture disc [PSE] and fusible link [TSE] apply to all sensors or
    primary elements

    intended to protect against emergency pressure or temperature conditions.

    (7) The combinations in the [C] column are used for:

    (a) Discrete single case instruments that do not have operator-visible indication
    of measured

    variable, setpoint, or output signal.

    (b) Controller functions configured in shared display, shared control systems
    where

    indication and recording are configurable functions available on demand.

    (8) The combinations in the [IC] and [RC] columns indicate the order to be followed
    in forming the

    Functional Identification of a controller device or function that also provides
    indication or

    recording.

    (9) The combinations in the [CV] column indicate the order to be followed in forming
    the Functional

    Identification for self-actuated control valves.

    (10) Flow safety valve [FSV] applies to valves intended to protect against an
    emergency excess flow

    or loss of flow condition. Pressure safety valve [PSV], and temperature safety
    valve [TSV] apply

    to valves intended to protect against emergency pressure and temperature conditions

    (11) A self-actuated pressure valve that prevents operation of a fluid system
    at a higher-than-desired

    pressure by bleeding fluid from the system is a backpressure control valve [PCV],
    even if the

    valve is not normally used.

    (a) This valve should be designated a pressure safety valve [PSV] if it protects
    against

    emergency conditions hazardous to personnel and/or equipment that are not expected
    to arise

    normally.'
