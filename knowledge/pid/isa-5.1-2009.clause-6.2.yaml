explanation: '6.2 Measurement units

  6.2.1 The dimensions are represented by measurement units (m.u.) that, as a minimum,
  shall have

  equivalent dimensions equal to:

  a) One-sixteenth inch (1/16 inch or 0.0625 inch).

  b) One and one-half millimeters (1.50 millimeters).

  6.2.2 Symbols drawn in any full size diagram shall be the product of the symbol’s
  geometric shape m.u.

  times a selected equivalent dimension equal to or greater than the minimum equivalent
  dimension.

  6.2.3 Lettering shown is the minimum size allowed for full size symbols.'
