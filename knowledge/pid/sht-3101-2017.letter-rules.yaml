id: sht-3101-2017.letter-rules
version: 1
concept: 仪表字母解释 / Instrument-letter interpretation
catalog:
  role: supporting
  short_name: 仪表字母解释 / Instrument-letter interpretation
  interpretation: The first letter identifies the directly measured/initiating variable, optionally with
    a modifier. A denotes material-composition or physical-property analysis, while vibration/mechanical
    analysis uses V. User-defined letters N and O require consistent project definitions. Modifiers D,
    F and Q stay in the same variable numbering sequence. For readout/passive functions, G identifies
    glass/local direct viewing and I indirect observation. These rules interpret observed text; they cannot
    supply missing tags. See the letter table source image for the complete mapping.
