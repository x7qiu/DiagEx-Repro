id: isa-5.1-2009.clause-2.7
version: 2
concept: 2.7 — Extent of symbolization
aliases: []
reference_type: convention
kind: definition
curation: source_transcribed
source_status: normative
explanation: '2.7 Extent of symbolization

  2.7.1 This standard provides symbol sets for the graphic depiction of a limited
  or total functionality of

  instruments and devices, entire monitor or control loops, or control circuits.

  2.7.2 The amount of detail to be shown by the use of symbols depends on the purpose
  and audience

  for which the document is being prepared.

  2.7.3 Sufficient symbols shall be used to show the functionality of the instrumentation
  and/or control

  loop being depicted; it is not considered necessary to provide a symbol for each
  instrument device and

  each function required by a loop.

  2.7.4 Additional construction, fabrication, installation, and operation details
  of an instrument are better

  described in a suitable specification, data sheet, loop diagram, installation/wiring
  drawing, or sketch, or

  other document intended for those requiring such details.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
