  interpretation: 管道交叉 / Crossing of pipes. Defined by SH/T 3101:2017, Table 4.1, item 16. For equal-class
    piping (including signals), the vertical stroke is interrupted at a crossing. For primary/secondary
    crossings, interrupt the secondary line; for piping/signal crossings, interrupt the signal. A crossing
    is not by itself a junction.
