source_status: normative
explanation: '3.1.59 shared display:

  the operator interface device, a video, light-emitting diode, liquid crystal, or
  other display unit, used to

  display process control information from a number of sources at the command of the
  operator, often used

  to describe the visual features of a distributed control system, programmable logic
  controller, or other

  microprocessor or mainframe computer based system.'
