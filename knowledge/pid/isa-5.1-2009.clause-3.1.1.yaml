source_status: normative
explanation: '3.1.1 accessible:

  a feature of a device or function, a feature of an interactive shared system function,
  or a feature that can

  be used or seen by an operator for the purpose of performing control operations,
  such as setpoint

  changes, auto-manual transfer, or on-off operations.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
