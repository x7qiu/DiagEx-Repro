explanation: 'B.10 Function block symbols

  B.10.1 Signal processing functions should be identified by a function block symbol
  from Table 7.6 that is:

  a) Appended to a bubble if an Instrument/Tag Number is required:

  Σ

  FY

  *012

  b) Attached tangentially to the affected bubble and in line with the signal if the
  function is an

  integral part of the affected bubble:

  FI

  Σ

  *012

  B.10.2 An example of a common application is the calculation of mass flow with an
  orifice plate primary

  element:

  a) Separate devices or functions that require separate bubbles and tag numbers:

  FT PT TT

  *01 *01 *01

  ÷

  X

  √⎯

  FY FY FY FI

  *01-C *01-B *01-A *01

  b) Separate devices or application software functions that do not require separate
  bubbles

  or tag numbers for each function:

  TT

  *01

  FI

  PT ÷

  X

  √⎯

  *01

  *01

  FT

  *01

  c) Integral devices or application software functions that do not require separate
  bubbles or

  tag numbers for each function:

  TT

  *01

  FI PT FT

  *01 *01 *01

  MASS

  FLOW'
