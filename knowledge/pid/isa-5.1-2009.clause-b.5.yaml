explanation: 'B.5 Device and function symbols

  B.5.1 Instrumentation devices and functions are constructed for sketches, drawings,
  and diagrams by

  the use of the generic bubble and other geometric symbols and specific graphic symbols
  found in

  Clause 5.

  B.5.2 It is not necessary to show a symbol or a bubble for every device or function
  required by a loop if

  the need for the device or function or its tag number is clearly understood; for
  example:

  a) Symbols are not required, but may be used, for control valve positioners and
  stream

  sample conditioner components.

  b) Bubbles are not required, but may be used, for orifice plate, thermocouple, and
  control

  valve graphic symbols.

  B.5.3 When “smart” drawings, such as computer-generated P&IDs, that are linked to
  instrument

  indexes or data sheets are used, a bubble or graphic symbol to which an instrument
  tag number

  is attached should be used for all devices and functions that are to be indexed
  or require data

  sheets.'
