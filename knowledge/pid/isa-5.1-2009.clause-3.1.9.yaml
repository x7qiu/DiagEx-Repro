explanation: '3.1.9 behind the panel:

  a location that in a broad sense means “not normally accessible to an operator,”
  such as the rear of an

  instrument or control panel, an enclosed instrument rack or cabinet, or an instrument
  rack room within an

  area that contains a panel.'
