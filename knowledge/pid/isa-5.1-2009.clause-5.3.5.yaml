explanation: '5.3.5 Table 5.5 — Functional diagramming symbols:

  (1) Signal flow is assumed to be from top-to-bottom or from left-to-right.

  (2) Symbols are shown in a vertical diagram format.

  (3) Symbols shall be rotated 90 degrees counterclockwise in a horizontal diagram
  format.

  (4) Insert signal processing symbol from Table 5.6 at (*).'
