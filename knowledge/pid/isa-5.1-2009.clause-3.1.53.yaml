explanation: '3.1.53 relay:

  a device, whose function is to pass on information in an unchanged form or in some
  modified form, often

  used to mean the preferred term computing device.

  a) relay is a term applied specifically to an electric, pneumatic, or hydraulic
  switching device that is

  actuated by a signal, and to functions performed by a relay.'
