  short_name: 仪表系统、位置与文字 / Instrument system, location and text conventions
  interpretation: Table 4.6 distinguishes DCS (circle in square), SIS (diamond in square), third-party
    systems (diamond in square with system-type text), and individual instruments (circle). Horizontal
    solid/dashed and single/double lines encode installation/display location as specified by each row.
    *** is a system-type placeholder, not symbol geometry. When a tag cannot fit, the instrument frame
    may be broken or extended. Example letters and digits in these notes are not actual tags. The drafting
    diameter is 10–12 mm, not a pixel threshold.
