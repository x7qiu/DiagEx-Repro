explanation: '4.1 Identification letters table

  4.1.1 This clause provides in tabular form the alphabetic building blocks of the
  Instrument and Function

  Identification System in a concise, easily referenced manner.

  4.1.2 Table 4.1, together with Clause 4.2, defines and explains the meanings of
  the individual letters

  when used to identify loop and device functions.

  4.1.3 The letters in Table 4.1 shall have the mandatory meanings assigned except
  the user shall

  assign:

  a) Variables to the User’s Choice letters in column 1 and functions to the User’s
  Choice

  letters in columns 3, 4 and 5 when such letters are used.

  b) Meanings to the blanks in columns 2, 3, 4, and 5 when additional functions or
  modifiers

  are assigned.

  c) When such assignments are made they shall be documented in the User’s engineering

  and design standards or guidelines and on drawing legend sheets.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
