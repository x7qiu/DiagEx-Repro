  short_name: Instrument identification letters
  interpretation: 'Interpret instrument letters according to their position: measured/initiating
    variable, variable modifier, readout/passive function, output/active function,
    or function modifier. User-choice letters and assigned blank positions require
    the project''s documented definitions or drawing legend. Reference examples are
    not actual instrument tags.'
