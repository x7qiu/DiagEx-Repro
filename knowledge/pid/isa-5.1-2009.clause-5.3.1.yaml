catalog:
  role: supporting
  short_name: Instrument shapes and location markings
  interpretation: 'A circle represents an individual hardware instrument. A circle
    in a square represents the project''s primary shared display/control system or
    BPCS; a diamond in a square represents its alternate shared display/control system
    or SIS. The project must document which meaning is selected: primary/alternate
    are system distinctions, not interchangeable symbol styles. Horizontal solid or
    dashed markings distinguish location and operator accessibility as specified in
    each table row. Accessibility includes viewing, setpoint adjustment, and operating-mode
    changes. Shapes alone do not prove safety-system membership.'
