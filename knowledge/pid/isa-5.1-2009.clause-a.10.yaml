explanation: 'A.10 Loop number and instrument/tag number suffixes

  A.10.1 A Loop Number Suffix may be added to a Loop Number to identify identical
  loops on identical

  equipment in the same processing unit when the service or equipment is assigned
  the same

  equipment identification number with a suffix, such as reactors, heat exchangers,
  and pumps.

  A.10.2 A Loop Suffix may use alphabetic or numeric characters according to User/Owner
  established

  practice and should be located after the Loop Identification Number as illustrated
  in Table A.1.

  A.10.3 A Loop Suffix may be located after the Loop Letters when user, owner, computer,
  or

  microprocessor information systems will not allow alphabetic or additional numeric
  characters in

  the numerical part of an identification number:

  A.10.4 An Identification/Tag Number Suffix should be added to Instrument Identification/Tag
  Numbers in

  the loop to designate two or more similar devices or functions:

  a) Case 1 – in different services, such as control valves that direct flow to different
  places,

  or auxiliary devices, such as those that perform different functions.

  b) Case 2 – in the same service, such as control valves that direct flow to the
  same place,

  or auxiliary devices, such as those that perform the same function.

  A.10.5 Additional Identification/Tag Number Suffixes should be added when two or
  more similar devices

  or functions are also duplicated, using alternating alpha/numeric characters.

  A.10.6 For examples of Loop Number and Instrument/Tag Number Suffixes, see Table
  A.4.'
