concept: B.1 — Graphic symbols
aliases: []
reference_type: convention
kind: common_practice
curation: source_transcribed
source_status: informative
explanation: 'B.1 Graphic symbols

  B.1.1 This informative annex to the standard describes the use of graphic symbols
  that are used to

  depict instrument loop devices and functions, application software functions, and
  the

  interconnections between them that is logical, unique, and consistent in application
  with a

  minimum of exceptions, special uses, or requirements.

  B.1.2 Graphic symbols, when used with identification letters and numbers constructed
  as described in

  Annex A, should as a minimum describe the functionality of, and if assigned a loop
  number

  provide a unique identity for, each device and function shown.'
exceptions:
- Explicit drawing legends and confirmed project definitions take precedence.
- Source illustrations are reference material, not evidence that objects or connections
  exist in a drawing.
