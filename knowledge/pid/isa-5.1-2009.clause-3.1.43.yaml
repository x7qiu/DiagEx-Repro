source_status: normative
explanation: '3.1.43 monitor:

  a general term for an instrument or instrument system used to measure or sense the
  status or magnitude

  of one or more variables for the purpose of deriving useful information, and that
  sometimes means

  analyzer, indicator, or alarm.'
