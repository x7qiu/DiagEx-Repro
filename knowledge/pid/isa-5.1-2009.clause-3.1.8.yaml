source_status: normative
explanation: '3.1.8 basic process control system (BPCS):

  instrumentation and systems that are installed to monitor and control normal production
  operations using,

  but not limited to combinations of single-loop pneumatic and electronic monitors
  and controllers,

  programmable logic controllers and distributed control systems.

  (a) A BPCS is necessary to operate a plant or process.'
