catalog:
  role: supporting
  short_name: ISA 5.1:2009 — Instrument identification letter table
  interpretation: Read each letter by its named column in this ISA 5.1:2009 matrix. Blank cells have no
    assigned meaning; user-choice cells require a documented project definition. Footnote markers are
    references, not letters or tag characters. Explicit drawing definitions take precedence for extraction;
    preserve differences from the declared standard. Do not import meanings from other standards or infer
    missing tags.
